  @media (pointer:coarse){#touch{display:flex}}
</style>

<body>
<canvas id="c" width="256" height="240"></canvas>
<div id="touch">
  <div><button data-k="TLeft">&#9664;</button><button data-k="TRight">&#9654;</button></div>
  <div><button data-k="TRun">B</button><button data-k="TJump">A</button></div>
</div>
<script>
'use strict';
/* =====================================================================
   Super Mario Bros. - Fase 1-1 (clone feito do zero, graficos em codigo)
   ===================================================================== */
const T = 16, W = 256, H = 240, LW = 212;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FONT = '8px "Press Start 2P", monospace';

/* ------------------------------ AUDIO ------------------------------ */
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type = 'square', vol = 0.07, delay = 0) {
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.12) {
  if (muted) return; const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start();
}
const seq = (notes, step, type = 'square', len = 0.09, vol = 0.06) => notes.forEach((f, i) => tone(f, f, len, type, vol, i * step));
const sfx = {
  jump: () => tone(260, 640, 0.2),
  coin: () => { tone(988, 988, 0.07); tone(1319, 1319, 0.3, 'square', 0.07, 0.07); },
  stomp: () => tone(320, 70, 0.14),
  bump: () => tone(130, 90, 0.09, 'triangle', 0.25),
  brk: () => noise(0.28, 0.18),
  sprout: () => tone(180, 900, 0.3, 'triangle', 0.15),
  power: () => seq([392, 523, 659, 784, 1047, 784, 1047, 1319], 0.055),
  shrink: () => seq([1319, 1047, 784, 659, 523, 392], 0.055),
  up1: () => seq([659, 784, 1319, 1047, 1175, 1568], 0.08),
  die: () => seq([494, 466, 440, 415, 392, 370, 349, 330, 311, 294], 0.1, 'square', 0.12),
  flag: () => tone(1400, 120, 1.3, 'square', 0.06),
  fire: () => tone(1000, 300, 0.1),
  kick: () => tone(450, 220, 0.09),
  tick: () => tone(1500, 1500, 0.03, 'square', 0.04),
  clear: () => seq([523, 659, 784, 1047, 784, 1047, 1319, 1568, 1319, 1568, 2093], 0.09, 'square', 0.12),
};

/* ------------------------------ INPUT ------------------------------ */
const keys = {}, pressed = {};
const LEFT = ['ArrowLeft', 'KeyA', 'TLeft'], RIGHT = ['ArrowRight', 'KeyD', 'TRight'],
      JUMP = ['Space', 'KeyZ', 'KeyK', 'ArrowUp', 'KeyW', 'TJump'],
      RUN = ['ShiftLeft', 'ShiftRight', 'KeyX', 'KeyJ', 'TRun'], START = ['Enter', 'Space', 'TJump'];
const any = (m, c) => c.some(k => m[k]);
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; audio();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; audio(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
});
cv.addEventListener('pointerdown', () => { pressed.Enter = true; audio(); });

/* ----------------------------- SPRITES ----------------------------- */
const norm = rows => rows.map(r => r.padEnd(16, '.').slice(0, 16));
/* Mario pequeno (16x16): R=camisa/bone, B=macacao/cabelo/sapato, S=pele, Y=botao */
const MBODY = [
  '.....RRRRR......', '....RRRRRRRRR...', '....BBBSSBS.....', '...BSBSSSBSSS...', '...BSBBSSSBSSS..',
  '...BBSSSSBBBB...', '.....SSSSSSS....', '....RRBRRR......', '...RRRBRRBRRR...', '..RRRRBBBBRRRR..',
  '..SSRBYBBYBRSS..', '..SSSBBBBBBSSS..', '..SSBBBBBBBBSS..'];
const MLEGS = {
  stand: ['...BBBB..BBBB...', '..BBBBB..BBBBB..', '..BBBBB..BBBBB..'],
  w1: ['...BBBBB.BBB....', '..BBBBBBB.BBB...', '.BBBB.......BBB.'],
  w2: ['....BBBBBBB.....', '....BBBBBBBB....', '....BBBB.BBBB...'],
  w3: ['....BBB.BBBBB...', '...BBB..BBBBBB..', '..BBB.....BBBB..'],
};
const MJUMP = MBODY.slice(0, 7).concat([
  '....RRBRRR..SS..', '...RRRBRRBRSSS..', '..RRRRBBBBRSSS..', '..SSRBYBBYBRR...', '.SSSBBBBBBBRR...',
  '.SS.BBBBBBBBB...', '....BBBBBBBBBB..', '...BBBB..BBBBB..', '...BBB....BBBB..']);
const ROWS = {};
for (const k in MLEGS) ROWS['m_' + k] = norm(MBODY.concat(MLEGS[k]));
ROWS.m_jump = norm(MJUMP);

/* Mario grande (16x32) */
const BHEAD = [
  '.....RRRRR......', '....RRRRRRRRR...', '....RRRRRRRRR...', '....BBBSSBS.....', '...BSBSSSBSSS...',
  '...BSBBSSSBSSS..', '...BBSSSSBBBB...', '.....SSSSSSS....', '.....SSSSSS.....'];
const BTOR = [
  '....RRBRRR......', '...RRRBRRBRRR...', '..RRRRBBBBRRRR..', '..RRRBBBBBBRRR..', '..RRRBYBBYBRRR..',
  '..RRRBBBBBBRRR..', '..RRRBBBBBBRRR..', '..SSRBBBBBBRSS..', '..SSSBBBBBBSSS..', '..SSSBBBBBBSSS..',
  '.....BBBBBB.....', '....BBBBBBBB....', '...BBBBBBBBBB...'];
const BLEGS = {
  stand: ['...BBBB..BBBB...', '...BBBB..BBBB...', '...BBBB..BBBB...', '...BBBB..BBBB...', '...BBBB..BBBB...',
          '...BBBB..BBBB...', '..BBBBB..BBBBB..', '.BBBBBB..BBBBBB.', '.BBBBBB..BBBBBB.', '.BBBBBB..BBBBBB.'],
  w1: ['...BBBBBBBBBB...', '..BBBBBBBBBBB...', '..BBBBBB.BBBBB..', '.BBBBBB...BBBBB.', '.BBBBB.....BBBBB',
       'BBBBB.......BBBB', 'BBBBBB......BBBB', 'BBBBBB.....BBBBB', '..........BBBBBB', '..........BBBBBB'],
  w2: ['....BBBBBBBB....', '....BBBBBBBB....', '....BBBBBBBB....', '....BBBBBBBB....', '....BBB..BBB....',
       '....BBB..BBB....', '....BBB..BBB....', '...BBBB..BBBB...', '..BBBBB..BBBBB..', '..BBBBB..BBBBB..'],
  w3: ['...BBBBBBBBBB...', '...BBBBBBBBBBB..', '..BBBBB.BBBBBB..', '.BBBBB...BBBBBB.', 'BBBBB.....BBBBB.',
       'BBBB.......BBBBB', 'BBBB......BBBBBB', 'BBBBB.....BBBBBB', 'BBBBBB..........', 'BBBBBB..........'],
};
const BJUMP_TOR = [
  '....RRBRRR.SSS..', '...RRRBRRBRSSSS.', '..RRRRBBBBRRSSS.', '..RRRBBBBBBRR...', '..RRRBYBBYBRR...',
  '..SSRBBBBBBRR...', '.SSSRBBBBBBRR...', '.SSSSBBBBBBR....', '.SS..BBBBBB.....', '.....BBBBBB.....',
  '.....BBBBBB.....', '....BBBBBBBB....', '...BBBBBBBBBB...'];
const BJUMP_LEG = [
  '...BBBBBBBBBBB..', '..BBBBBB..BBBBB.', '..BBBBB....BBBBB', '.BBBBB.....BBBBB', '.BBBBB......BBBB',
  'BBBBBB.......BBB', 'BBBBB........BBB', 'BBBB............', '................', '................'];
for (const k of ['stand', 'w1', 'w2', 'w3']) ROWS['M_' + k] = norm(BHEAD.concat(BTOR, BLEGS[k]));
ROWS.M_jump = norm(BHEAD.concat(BJUMP_TOR, BJUMP_LEG));

/* Goomba: B=corpo, S=base clara, W=olho, K=contorno/pe */
ROWS.goomba = norm([
  '.....KKKKKK.....', '...KKBBBBBBKK...', '..KBBBBBBBBBBK..', '.KBBBBBBBBBBBBK.', '.KBBKBBBBBBKBBK.',
  'KBBBKKBBBBKKBBBK', 'KBBWWKKBBKKWWBBK', 'KBBWWWKBBKWWWBBK', 'KBBWWKKBBKKWWBBK', 'KBBBWWBBBBWWBBBK',
  '.KBBBBBBBBBBBBK.', '..KKBBBBBBBBKK..', '....KSSSSSSK....', '...KSSSSSSSSK...', '.KKKKSSSSSSKKK..',
  'KKKKKK..........']);
ROWS.goomba_sq = norm([
  '................', '................', '................', '................', '................', '................',
  '................', '................', '................', '................', '..KKKKKKKKKKKK..', '.KBBBBBBBBBBBBK.',
  'KBBKWWBBBBWWKBBK', 'KBBBKKBBBBKKBBBK', '.KKSSSSSSSSSSKK.', '..KKKKKKKKKKKK..']);

/* Koopa Troopa (16x24, virado para a esquerda): G=casco, L=brilho, S=pele, W=branco, K=preto */
const KHEAD = [
  '................', '................', '.....SSSSS......', '....SSSSSSS.....', '....SSWWSSS.....',
  '...SSSKWSSS.....', '..SSSSSSSSS.....', '..SSSSSSSS......', '....SSSSSS......'];
const KBODY = [
  '....SSSSGGGG....', '...SSSGGGGGGG...', '...SSGGLLGGGGG..', '..SSGGLLLLGGGG..', '...SGGLLWWLGGG..',
  '....GGLLLLLGGG..', '....GGGLLLGGGG..', '....WWWWWWWWWW..'];
ROWS.koopa1 = norm(KHEAD.concat(KBODY, [
  '....SSSSSSSSSS..', '....SSSSSSSSSS..', '....SSSS..SSSS..', '....SSSS..SSSS..', '...SSSSS..SSSSS.', '..SSSSSS..SSSSSS', '..SSSSSS..SSSSSS']));
ROWS.koopa2 = norm(KHEAD.concat(KBODY, [
  '....SSSSSSSSSS..', '....SSSSSSSSSS..', '....SSSS.SSSS...', '....SSSS..SSSS..', '...SSSSS...SSS..', '..SSSSSS........', '..SSSSSS........']));
ROWS.shell = norm([
  '................', '................', '................', '................', '.....GGGGGG.....', '...GGGGGGGGGG...', '..GGLLGGGGLLGG..', '..GLLLLGGLLLLG..',
  '.GGLLLLGGLLLLGG.', '.GGGLLGGGGLLGGG.', 'GGGGGGGGGGGGGGGG', 'WWWWWWWWWWWWWWWW', '.WWSSSSSSSSSSWW.', '..SSSSKSSKSSSS..',
  '...SSKKSSKKSS...', '....SSSSSSSS....']);
ROWS.mush = norm([
  '.....RRRRRR.....', '...RRRWWWWRRR...', '..RRWWWWWWWRRR..', '.RRWWWWRRRWWWRR.', '.RRWWWWRRRWWWRR.', 'RRRRWWRRRRRWWRRR',
  'RRRRRRRRRRRRRRRR', 'RRRRRRRRRRRRRRRR', '.RRRRRRRRRRRRRR.', '...KSSSSSSSSK...', '..SSSKSSSSKSSS..', '..SSSKSSSSKSSS..',
  '..SSSSSSSSSSSS..', '...SSSSSSSSSS...', '....SSSSSSSS....', '................']);
ROWS.flower = norm([
  '......OOOO......', '....OOYYYYOO....', '...OYYRRRRYYO...', '...OYRRWWRRYO...', '...OYRRWWRRYO...', '...OYYRRRRYYO...',
  '....OOYYYYOO....', '......OOOO......', '.G....GGGG....G.', '.GG...GGGG...GG.', '..GGG.GGGG.GGG..', '....GGGGGGGGG...',
  '.......GG.......', '.......GG.......', '.......GG.......', '......GGGG......']);
ROWS.star = norm([
  '.......YY.......', '.......YY.......', '......YYYY......', '......YYYY......', 'YYYYYYYYYYYYYYYY', '.YYYYYYYYYYYYYY.',
  '..YYYKYYYYKYYY..', '...YYKYYYYKYY...', '....YYYYYYYYY...', '....YYYYYYYY....', '...YYYYYYYYYY...', '...YYYY..YYYY...',
  '..YYYY....YYYY..', '..YYY......YYY..', '.YYY........YYY.', '.YY..........YY.']);
const PAL = {
  m0: { R: '#b53120', B: '#6b6d00', S: '#ea9e22', Y: '#f8d838' },
  m1: { R: '#fcfcfc', B: '#d82800', S: '#ea9e22', Y: '#f8d838' },
  m2: { R: '#000000', B: '#fc9838', S: '#ea9e22', Y: '#fcfc00' },
  m3: { R: '#00a800', B: '#fcfcfc', S: '#ea9e22', Y: '#b53120' },
  goomba: { B: '#c84c0c', S: '#fcd8a8', W: '#fcfcfc', K: '#000000' },
  koopa: { G: '#00a800', L: '#b8f818', S: '#f8d878', W: '#fcfcfc', K: '#000000' },
  mush: { R: '#d82800', W: '#fcfcfc', S: '#fcd8a8', K: '#000000' },
  up1: { R: '#00a800', W: '#fcfcfc', S: '#fcd8a8', K: '#000000' },
  flower: { O: '#d82800', Y: '#fc9838', R: '#fcfc00', W: '#fcfcfc', G: '#00a800' },
  star: { Y: '#f8d838', K: '#000000' },
};
const sprCache = new Map();
function spr(id, pal, flip, vflip) {
  const key = id + '|' + pal + '|' + (flip ? 1 : 0) + (vflip ? 1 : 0);
  let c = sprCache.get(key); if (c) return c;
  const rows = ROWS[id], P = PAL[pal], w = 16, h = rows.length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
    const ch = rows[r][q]; if (ch === '.' || !P[ch]) continue;
    x.fillStyle = P[ch];
    x.fillRect(flip ? w - 1 - q : q, vflip ? h - 1 - r : r, 1, 1);
  }
  sprCache.set(key, c); return c;
}
function drawSpr(id, pal, x, y, flip, vflip) { ctx.drawImage(spr(id, pal, flip, vflip), Math.round(x - camX), Math.round(y)); }

/* ----- tiles pre-renderizados ----- */
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); fn(x); return c; }
const TILE = {};
function brickPattern(x, base, mortar) {
  x.fillStyle = base; x.fillRect(0, 0, 16, 16); x.fillStyle = mortar;
  x.fillRect(0, 0, 16, 1); x.fillRect(0, 7, 16, 1); x.fillRect(0, 15, 16, 1);
  x.fillRect(7, 0, 1, 7); x.fillRect(3, 8, 1, 7); x.fillRect(11, 8, 1, 7); x.fillRect(15, 0, 1, 7);
  x.fillStyle = '#fcbcb0'; x.fillRect(0, 1, 7, 1); x.fillRect(8, 1, 7, 1); x.fillRect(4, 8, 7, 1); x.fillRect(12, 8, 3, 1); x.fillRect(0, 8, 3, 1);
}
TILE[1] = mk(16, 16, x => { // chao
  brickPattern(x, '#c84c0c', '#000');
});
TILE[2] = mk(16, 16, x => brickPattern(x, '#c84c0c', '#000'));
function hardBlock(x, a, b, c) {
  x.fillStyle = '#000'; x.fillRect(0, 0, 16, 16);
  x.fillStyle = a; x.fillRect(1, 1, 14, 14);
  x.fillStyle = b; x.beginPath(); x.moveTo(15, 1); x.lineTo(15, 15); x.lineTo(1, 15); x.lineTo(2, 14); x.lineTo(14, 14); x.lineTo(14, 2); x.fill();
  x.fillStyle = c; x.fillRect(3, 3, 10, 10);
}
TILE[5] = mk(16, 16, x => hardBlock(x, '#fcbcb0', '#c84c0c', '#c84c0c'));
TILE[4] = mk(16, 16, x => {
  x.fillStyle = '#c84c0c'; x.fillRect(0, 0, 16, 16); x.fillStyle = '#000';
  x.fillRect(0, 0, 16, 1); x.fillRect(0, 15, 16, 1); x.fillRect(0, 0, 1, 16); x.fillRect(15, 0, 1, 16);
  x.fillRect(2, 2, 2, 2); x.fillRect(12, 2, 2, 2); x.fillRect(2, 12, 2, 2); x.fillRect(12, 12, 2, 2);
  x.fillStyle = '#7a2c00'; x.fillRect(1, 1, 14, 1);
});
const QFR = ['#e0a000', '#fcc43c', '#fcdc8c', '#fcc43c'];
const QGLYPH = ['.XXXX.', 'XX..XX', '....XX', '...XX.', '..XX..', '......', '..XX..'];
TILE.q = QFR.map(col => mk(16, 16, x => {
  x.fillStyle = '#000'; x.fillRect(0, 0, 16, 16); x.fillStyle = col; x.fillRect(1, 1, 14, 14);
  x.fillStyle = '#fcfcfc'; x.fillRect(1, 1, 14, 1); x.fillRect(1, 1, 1, 14);
  x.fillStyle = '#7a3000'; x.fillRect(2, 14, 13, 1); x.fillRect(14, 2, 1, 13);
  x.fillStyle = '#000'; [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(p => x.fillRect(p[0], p[1], 1, 1));
  QGLYPH.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === 'X') { x.fillStyle = '#000'; x.fillRect(5 + i + 1, 4 + j + 1, 1, 1); x.fillStyle = '#c84c0c'; x.fillRect(5 + i, 4 + j, 1, 1); } }));
}));
TILE[6] = mk(16, 16, x => { x.fillStyle = '#000'; x.fillRect(0, 0, 16, 16); x.fillStyle = '#00a800'; x.fillRect(1, 1, 15, 14); x.fillStyle = '#b8f818'; x.fillRect(3, 1, 3, 14); x.fillStyle = '#005800'; x.fillRect(12, 1, 4, 14); });
TILE[7] = mk(16, 16, x => { x.fillStyle = '#000'; x.fillRect(0, 0, 16, 16); x.fillStyle = '#00a800'; x.fillRect(0, 1, 15, 14); x.fillStyle = '#b8f818'; x.fillRect(1, 1, 2, 14); x.fillStyle = '#005800'; x.fillRect(9, 1, 6, 14); });
TILE[8] = mk(16, 16, x => { x.fillStyle = '#000'; x.fillRect(2, 0, 1, 16); x.fillStyle = '#00a800'; x.fillRect(3, 0, 13, 16); x.fillStyle = '#b8f818'; x.fillRect(5, 0, 3, 16); x.fillStyle = '#005800'; x.fillRect(12, 0, 4, 16); });
TILE[9] = mk(16, 16, x => { x.fillStyle = '#00a800'; x.fillRect(0, 0, 13, 16); x.fillStyle = '#b8f818'; x.fillRect(1, 0, 2, 16); x.fillStyle = '#005800'; x.fillRect(8, 0, 5, 16); x.fillStyle = '#000'; x.fillRect(13, 0, 1, 16); });

function blob(w, h, shapes, fill, edge, flatY, extra) {
  return mk(w, h, x => {
    const img = x.createImageData(w, h);
    const inside = (px, py, r) => shapes.some(s => { const dx = (px + 0.5 - s[0]) / Math.max(0.01, s[2] - r), dy = (py + 0.5 - s[1]) / Math.max(0.01, s[3] - r); return dx * dx + dy * dy <= 1; });
    const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
    const F = hex(fill), E = hex(edge);
    for (let py = 0; py < Math.min(h, flatY); py++) for (let px = 0; px < w; px++) {
      if (!inside(px, py, 0)) continue;
      const col = inside(px, py, 1.2) && py < flatY - 1 ? F : E, i = (py * w + px) * 4;
      img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    if (extra) extra(x);
  });
}
const DECOR = {
  cloudS: blob(32, 24, [[9, 15, 9, 9], [23, 15, 9, 9], [16, 10, 10, 10]], '#fcfcfc', '#a4e4fc', 22),
  cloudL: blob(48, 24, [[9, 15, 9, 9], [24, 15, 9, 9], [39, 15, 9, 9], [16, 10, 10, 10], [32, 10, 10, 10]], '#fcfcfc', '#a4e4fc', 22),
  bush1: blob(16, 16, [[8, 16, 8, 8]], '#00a800', '#005800', 16),
  bush2: blob(32, 16, [[8, 16, 8, 8], [24, 16, 8, 8], [16, 11, 9, 10]], '#00a800', '#005800', 16),
  bush3: blob(48, 16, [[8, 16, 8, 8], [24, 16, 8, 8], [40, 16, 8, 8], [16, 12, 9, 11], [32, 12, 9, 11]], '#00a800', '#005800', 16),
  hillL: blob(80, 35, [[40, 35, 40, 35]], '#00a800', '#000', 35, x => {
    x.fillStyle = '#000'; x.fillRect(27, 15, 2, 5); x.fillRect(36, 15, 2, 5); x.fillRect(47, 15, 2, 5); x.fillRect(56, 15, 2, 5);
    x.fillRect(27, 18, 2, 3); x.fillStyle = '#005800'; x.fillRect(14, 28, 6, 3); x.fillRect(60, 28, 6, 3);

  hillS: blob(48, 19, [[24, 19, 24, 19]], '#00a800', '#000', 19, x => { x.fillStyle = '#000'; x.fillRect(19, 7, 2, 4); x.fillRect(27, 7, 2, 4); }),
};

/* ------------------------------ ESTADO ------------------------------ */
let map, content, enemies, items, coinPops, debris, bumps, fireballs, popups, camX;
let p;
const G = { mode: 'title', score: 0, coins: 0, lives: 3, time: 400, tc: 0, tick: 0, timer: 0, flagY: 52, paused: false };
const POLE = 198 * T;

function buildLevel() {

}
function drawTiles() {
  const bm = {}; for (const b of bumps) bm[b.tx + ',' + b.ty] = -Math.round(Math.sin(b.t / 12 * Math.PI) * 6);
  const t0 = Math.max(0, Math.floor(camX / T)), t1 = Math.min(LW - 1, t0 + 17);
  const qf = Math.floor(G.tick / 8) % 4;
  for (let ty = 0; ty < 15; ty++) for (let tx = t0; tx <= t1; tx++) {
    const t = map[ty][tx]; if (!t || t === 10) continue;
    const img = t === 3 ? TILE.q[qf] : TILE[t];
    ctx.drawImage(img, Math.round(tx * T - camX), ty * T + (bm[tx + ',' + ty] || 0));
  }
}
function drawEnemy(e) {
  if (e.type === 'goomba') {
    if (e.state === 'squish') drawSpr('goomba_sq', 'goomba', e.x - 1, e.y, false);
    else drawSpr('goomba', 'goomba', e.x - 1, e.y, Math.floor(e.anim / 10) % 2 === 1, e.state === 'dead');
  } else {
    if (e.state === 'walk') drawSpr(Math.floor(e.anim / 10) % 2 ? 'koopa2' : 'koopa1', 'koopa', e.x - 1, e.y, e.dir > 0, false);
    else if (e.state === 'dead') drawSpr(e.h === 24 ? 'koopa1' : 'shell', 'koopa', e.x - 1, e.y, e.dir > 0, true);
    else drawSpr('shell', 'koopa', e.x - 1, e.y - 0, false);
  }
}
function drawPlayer() {
  if (p.state === 'bonus') return;
  if (p.inv > 0 && p.state === 'play' && p.freeze <= 0 && (G.tick >> 2) & 1) return;
  let big = p.h === 32;
  if (p.freeze > 0) big = !!((p.freeze >> 2) & 1);
  if (p.state === 'die') big = false;
  let pal = p.power === 2 ? 'm1' : 'm0';
  if (p.star > 0) pal = ['m0', 'm2', 'm3', 'm1'][Math.floor(G.tick / 3) % 4];
  let frame = 'stand';
  if (p.state === 'die') frame = 'jump';
  else if (p.state === 'flag') frame = 'w2';
  else if (!p.ground) frame = 'jump';
  else if (Math.abs(p.vx) > 0.15) frame = ['w1', 'w2', 'w3', 'w2'][Math.floor(p.anim) % 4];
  const id = (big ? 'M_' : 'm_') + frame, sh = big ? 32 : 16;
  drawSpr(id, pal, p.x - 2, p.y + p.h - sh, p.dir < 0);
}
function drawWorld() {
  ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, W, H);
  drawDecor(); drawCastle(); drawFlagPole();
  for (const it of items) if (it.emerge > 0) drawItem(it);
  drawTiles();
  for (const c of coinPops) {
    const f = Math.floor(c.t / 2) % 4, w = [8, 5, 2, 5][f]; ctx.fillStyle = '#000'; ctx.fillRect(Math.round(c.x + (8 - w) / 2 - camX) - 1, Math.round(c.y), w + 2, 14);
    ctx.fillStyle = '#fcc43c'; ctx.fillRect(Math.round(c.x + (8 - w) / 2 - camX), Math.round(c.y) + 1, w, 12);
  }
  for (const it of items) if (it.emerge <= 0) drawItem(it);
  for (const e of enemies) if (e.active) drawEnemy(e);
  for (const f of fireballs) { ctx.fillStyle = '#d82800'; ctx.fillRect(Math.round(f.x - camX), Math.round(f.y), 8, 8); ctx.fillStyle = '#fc9838'; ctx.fillRect(Math.round(f.x - camX) + 1, Math.round(f.y) + 1, 6, 6); ctx.fillStyle = '#fcfcfc'; ctx.fillRect(Math.round(f.x - camX) + (f.t >> 2 & 1 ? 2 : 4), Math.round(f.y) + 2, 2, 2); }
  for (const d of debris) { ctx.fillStyle = '#000'; ctx.fillRect(Math.round(d.x - camX), Math.round(d.y), 8, 8); ctx.fillStyle = '#c84c0c'; ctx.fillRect(Math.round(d.x - camX) + 1, Math.round(d.y) + 1, 6, 6); }
  drawPlayer();
  for (const s of popups) txt(s.txt, s.x - camX, s.y, '#fff', 8);
}
function hud() {
  txt('MARIO', 24, 16); txt(String(G.score).padStart(6, '0'), 24, 24);
  ctx.fillStyle = (G.tick >> 3) & 1 ? '#fcc43c' : '#e0a000'; ctx.fillRect(89, 24, 5, 8);
  txt('x' + String(G.coins).padStart(2, '0'), 96, 24);
  txt('WORLD', 144, 16); txt(' 1-1', 144, 24);
  txt('TIME', 200, 16); txt(G.mode === 'title' ? '' : String(G.time).padStart(3, ' '), 208, 24);
}
function render() {
  if (G.mode === 'intro' || G.mode === 'gameover') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); hud();
    if (G.mode === 'intro') {
      txtC('WORLD 1-1', 80); ctx.drawImage(spr('m_stand', 'm0', false), 96, 112); txt('x  ' + G.lives, 120, 120);
    } else txtC('GAME OVER', 112);
    return;
  }
  if (G.mode === 'title') {
    if (!map) { buildLevel(); resetPlayer(); }
    drawWorld(); hud();
    txtC('SUPER', 40, '#000', 24); txtC('SUPER', 38, '#fcfcfc', 24);
    txtC('MARIO BROS', 72, '#000', 16); txtC('MARIO BROS', 70, '#fc9838', 16);
    txtC('FASE 1-1  (CLONE)', 100, '#fff');
    if ((G.tick >> 5) & 1) txtC('PRESSIONE ENTER', 124, '#fff');
    ctx.fillStyle = '#0008'; ctx.fillRect(0, 150, W, 50);
    txtC('SETAS/AWD: MOVER', 156); txtC('ESPACO/Z: PULAR', 168); txtC('SHIFT/X: CORRER E FOGO', 180);
    txtC('P: PAUSA   M: SOM', 192);
    return;
  }
  drawWorld(); hud();
  if (G.paused) { ctx.fillStyle = '#0006'; ctx.fillRect(0, 0, W, H); txtC('PAUSADO', 112); }
  if (G.mode === 'clear') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 70, W, 100);
    txtC('FASE 1-1 COMPLETA!', 84, '#fcc43c'); txtC('PONTOS ' + String(G.score).padStart(6, '0'), 108);
    if ((G.tick >> 5) & 1) txtC('ENTER: JOGAR DE NOVO', 140);
  }
}

/* ------------------------------- LOOP ------------------------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve()).then(() => {
  buildLevel(); resetPlayer(); requestAnimationFrame(frame);
});
</script>
