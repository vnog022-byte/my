<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Super Mario Bros - Fase 1-1 (clone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh*256/240));height:auto;aspect-ratio:256/240;image-rendering:pixelated;image-rendering:crisp-edges;background:#5c94fc}
  #touch{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px;justify-content:space-between;pointer-events:none}
  #touch div{display:flex;gap:10px;pointer-events:auto}
  #touch button{width:64px;height:64px;border-radius:50%;border:2px solid #fff8;background:#0006;color:#fff;font:bold 20px sans-serif}
  #touch button:active{background:#fff6}
  @media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="256" height="240"></canvas>
<div id="touch">
  <div><button data-k="TLeft">&#9664;</button><button data-k="TRight">&#9654;</button></div>
  <div><button data-k="TRun">B</button><button data-k="TJump">A</button></div>
</div>
<script>
'use strict';
/* =====================================================================
   Super Mario Bros. - Fase 1-1 (clone feito do zero, graficos em codigo)
   ===================================================================== */
const T = 16, W = 256, H = 240, LW = 212;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FONT = '8px "Press Start 2P", monospace';

/* ------------------------------ AUDIO ------------------------------ */
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type = 'square', vol = 0.07, delay = 0) {
  if (muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol = 0.12) {
  if (muted) return; const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(a.destination); s.start();
}
const seq = (notes, step, type = 'square', len = 0.09, vol = 0.06) => notes.forEach((f, i) => tone(f, f, len, type, vol, i * step));
const sfx = {
  jump: () => tone(260, 640, 0.2),
  coin: () => { tone(988, 988, 0.07); tone(1319, 1319, 0.3, 'square', 0.07, 0.07); },
  stomp: () => tone(320, 70, 0.14),
  bump: () => tone(130, 90, 0.09, 'triangle', 0.25),
  brk: () => noise(0.28, 0.18),
  sprout: () => tone(180, 900, 0.3, 'triangle', 0.15),
  power: () => seq([392, 523, 659, 784, 1047, 784, 1047, 1319], 0.055),
  shrink: () => seq([1319, 1047, 784, 659, 523, 392], 0.055),
  up1: () => seq([659, 784, 1319, 1047, 1175, 1568], 0.08),
  die: () => seq([494, 466, 440, 415, 392, 370, 349, 330, 311, 294], 0.1, 'square', 0.12),
  flag: () => tone(1400, 120, 1.3, 'square', 0.06),
  fire: () => tone(1000, 300, 0.1),
  kick: () => tone(450, 220, 0.09),
  unroll: () => tone(140, 420, 0.12, 'triangle', 0.2),
  tick: () => tone(1500, 1500, 0.03, 'square', 0.04),
  clear: () => seq([523, 659, 784, 1047, 784, 1047, 1319, 1568, 1319, 1568, 2093], 0.09, 'square', 0.12),
};

/* ------------------------------ INPUT ------------------------------ */
const keys = {}, pressed = {};
const LEFT = ['ArrowLeft', 'KeyA', 'TLeft'], RIGHT = ['ArrowRight', 'KeyD', 'TRight'],
      JUMP = ['Space', 'KeyZ', 'KeyK', 'ArrowUp', 'KeyW', 'TJump'],
      RUN = ['ShiftLeft', 'ShiftRight', 'KeyX', 'KeyJ', 'TRun'], START = ['Enter', 'Space', 'TJump'];
const any = (m, c) => c.some(k => m[k]);
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true; audio();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; audio(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => b.addEventListener(ev, () => { keys[k] = false; }));
});
cv.addEventListener('pointerdown', () => { pressed.Enter = true; audio(); });

/* ART-BEGIN */
/* ----------------------------- ARTE -----------------------------
   Personagens originais desenhados em texto: cada letra e uma cor da paleta.
   compose() monta um quadro a partir de pedacos (cabeca, tronco, pernas, bracos).
   Cada secao (SEC:nome ... END:nome) guarda os desenhos e a escolha de quadro de um elemento. */
const compose = (w, h, parts) => {
  const g = Array.from({ length: h }, () => new Array(w).fill('.'));
  for (const [rows, dx = 0, dy = 0] of parts) rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) { const ch = r[x], X = x + dx, Y = y + dy; if (ch !== '.' && Y >= 0 && Y < h && X >= 0 && X < w) g[Y][X] = ch; }
  });
  return g.map(r => r.join(''));
};
const mirror = rows => rows.map(r => [...r].reverse().join(''));
const rot90 = rows => [...rows[0]].map((_, x) => rows.map(r => r[x]).reverse().join(''));
const recolor = (rows, m) => rows.map(r => r.replace(/./g, ch => m[ch] || ch));
const shade = rows => recolor(rows, { C: 'M', S: 'T' });
const swapLegs = rows => recolor(rows, { P: 'Q', Q: 'P', O: 'N', N: 'O' });
const ROWS = {}, PAL = {};
const sprCache = new Map();
function spr(id, pal, flip, vflip) {
  const key = id + '|' + pal + '|' + (flip ? 1 : 0) + (vflip ? 1 : 0);
  let c = sprCache.get(key); if (c) return c;
  const rows = ROWS[id], P = PAL[pal], w = rows[0].length, h = rows.length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
    const ch = rows[r][q]; if (ch === '.' || !P[ch]) continue;
    x.fillStyle = P[ch]; x.fillRect(flip ? w - 1 - q : q, vflip ? h - 1 - r : r, 1, 1);
  }
  sprCache.set(key, c); return c;
}

/* SEC:hero */
/* ---- Heroi pequeno (16x16), cabeca e paletas compartilhadas, e escolha de quadro do heroi.
   Sub-paletas: corpo K/C/L (contorno, moletom, claro), pele S + olho E(=K), pernas P/Q (calca vinho perto/longe).
   Tenis creme O = N (contrastam com moletom, ceu e tijolo); T, B fundidos em S (as letras continuam definidas para o heroi grande).
   Cada quadro e pintado em camadas por HS_paint: perna de longe, perna de perto e bracos (manga C + mao S)
   ganham contorno K automatico (sola K = contato com o chao); tronco e cabeca HH (12x7 em x=2).
   Caminhada em 4 quadros: contato (perna da frente quase vertical, pe de tras na ponta com o calcanhar
   erguido), passagem (perna de apoio reta, a livre dobrada com o pe erguido atras, canela inclinada), e os mesmos com as
   pernas trocadas. A ponta do pe de apoio vai 14 -> 9 -> 4: 5 px por quadro = HERO_STEP_S. ---- */
const HH = [
  '.K.....K....',
  'KLK...KLK...',
  'KLCK..KLCK..',
  'KCCCKKCCCCK.',
  'KCCLSSSSESSK',
  'KCCLSSSSEESK',
  '.KCLSSSSSSK.'];
const HH2 = ['............', 'KK.....KKK..', 'KLK...KLLCK.'].concat(HH.slice(3));
/* rosto de frente (susto), 10 de largura em x=3: 1 linha de pele na testa, olhos 2x2 arregalados, boca aberta */
const HF = [
  '.K......K.',
  'KLK....KLK',
  'KLCKKKKCLK',
  'KSSSSSSSSK',
  'KSEESSEESK',
  'KSEESSEESK',
  '.KSSKKSSK.'];
const HS_paint = parts => {
  const g = Array.from({ length: 16 }, () => new Array(16).fill('.'));
  for (const [rows, dx = 0, dy = 0, ol = false] of parts) {
    const h = rows.length, w = rows[0].length;
    const on = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== '.';
    if (ol) for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
      if (on(x, y) || !(on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) continue;
      const X = x + dx, Y = y + dy; if (X >= 0 && X < 16 && Y >= 0 && Y < 16 && (ol !== 's' || g[Y][X] === '.')) g[Y][X] = 'K';
    }
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) { const X = x + dx, Y = y + dy; if (r[x] !== '.' && X >= 0 && X < 16 && Y >= 0 && Y < 16) g[Y][X] = r[x]; } });
  }
  return g.map(r => r.join(''));
};
const HS_TORSO = ['...KCCCCCCCCK...', '...KCCCCCCCCK...', '....KLLLLLLK....'];
const hsKeep = (rows, set) => rows.map(r => r.replace(/./g, ch => set.includes(ch) ? ch : '.'));
/* pernas (preenchimento, 16 de largura), comecam na linha y0: Q/N = perna de longe, P/O = de perto */
const HS_LEG = {
  stand: [10,
    '.....QQQPPP.....',
    '.....QQ.PP......',
    '.....QQ.PP......',
    '....NNN.OOO.....',
    '....NNNNOOOO....'],
  cA: [11, // contato: perto na frente (quase vertical, degrau no joelho), longe atras na ponta do pe
    '......QQQPPP....',
    '....QQ.....PP...',
    '..NNN......OOO..',
    '...NN......OOOO.'],
  pA: [10, // passagem: perto reta embaixo do corpo, longe dobrada com o pe erguido atras, canela inclinada
    '.....QQPPP......',
    '.....QQPP.......',
    '...NQQ.PP.......',
    '...NN.OOO.......',
    '......OOOO......'],
  jump: [10, // perto encolhida (coxa horizontal), longe esticada para baixo
    '.....QQ.PPPP....',
    '....QQ.....PP...',
    '....QQ.....OOO..',
    '...QQ...........',
    '..NNN...........'],
  fall: [10,
    '.....QQQPPP.....',
    '....QQ...PP.....',
    '....QQ....PP....',
    '...NNN....OOO...',
    '...NNNN...OOOO..'],
  skid: [10, // pes plantados para o lado do movimento: longe esticada, perto dobrada
    '.......QQPPPP...',
    '.....QQ..PP.....',
    '...QQ...PP......',
    '..NNN...OOO.....',
    '.NNNN...OOOO....'],
  land: [12,
    '....QQQ..PPP....',
    '...NNN....OOO...',
    '...NNNN...OOOO..'],
  climb1: [10, // joelho de perto alto com o pe no mastro, perna de longe enganchada embaixo
    '....QQPPPPP.....',
    '....QQ....PP....',
    '....QQ....OOO...',
    '.....QQ.........',
    '.....NNNN.......'],
  die: [10,
    '.....QQQPPP.....',
    '.....QQ..PP.....',
    '.....QQ..PP.....',
    '.....NN..OO.....',
    '....NNN..OOO....'],
};
HS_LEG.cB = [HS_LEG.cA[0], ...swapLegs(HS_LEG.cA.slice(1))]; HS_LEG.pB = [HS_LEG.pA[0], ...swapLegs(HS_LEG.pA.slice(1))];
HS_LEG.climb2 = [HS_LEG.climb1[0], ...swapLegs(HS_LEG.climb1.slice(1))];
/* bracos de 2 px (manga C + mao S), com contorno: [desenho, x, y] */
const HS_ARM = {
  dn: ['C', 'S'], bk: ['.C', 'S.'], fw: ['C.', '.S'],
  upR: ['..S', '.C.', 'C..'], upL: ['S..', '.C.', '..C'],
  side: ['SC', 'SC'], sideR: ['CS', 'CS'], grab: ['CS'], reach: ['.S', 'C.'], hi: ['S.', 'S.', 'C.', '.C'],
  /* desenhos prontos (ja com contorno), sem contorno automatico */
  jumpR: ['..............KK', '.............KSS', '.............KSS', '.............KCC', '.............KCC',
    '.............KCC', '.............KCC', '.............CCC', '.............KKK'],
  skidL: ['.KK..', 'KSS..', 'KSS..', '.KKCK', '..KKC', '...KK'],
  dieV: ['K..............K', 'SK............KS', 'SK............KS', 'KC............CK', 'KC............CK',
    '.KCK........KCK.', '.KC..........CK.', '..K..........K..'],
};
const HS_RAW = ['jumpR', 'dieV', 'skidL'];
const hsFrame = ({ head = HH, hx = 2, hy = 0, tx = 0, leg, arms = [], torso = HS_TORSO, patch = {} }) => {
  const [y0, ...rows] = leg;
  const g = HS_paint([
    [hsKeep(rows, 'QN'), 0, y0, true],
    [hsKeep(rows, 'PO'), 0, y0, 's'],
    [torso, tx, 7 + hy],
    [head, hx, hy],
    ...arms.map(([a, x, y]) => [HS_ARM[a], x, y, !HS_RAW.includes(a)]),
    ...arms.map(([a, x, y]) => [HS_ARM[a], x, y]), // repinta as mangas por cima do contorno do outro braco
  ]);
  for (const y in patch) g[y] = patch[y]; // linhas pintadas a mao
  return g;
};
const ARMS_DN = [['dn', 3, 8], ['dn', 12, 8]];
const HS_SPATCH = { 14: '...KNNNNKOOOK...' }; // K separa os dois tenis
ROWS.h_stand = hsFrame({ leg: HS_LEG.stand, arms: ARMS_DN, patch: HS_SPATCH });
ROWS.h_stand2 = hsFrame({ head: HH2, leg: HS_LEG.stand, arms: ARMS_DN, patch: HS_SPATCH });
/* caminhada: no contato so a mao da frente aparece (a de tras fica atras do tronco); na passagem, uma mao */
/* contato: entre as pernas fica um triangulo de ceu (linhas 11-12 pintadas a mao) */
const HS_CPATCH = { 11: '....KQQQKPPPKK..', 12: '...KQQK..KPPK...' };
const HS_CPATCH_B = { 11: swapLegs([HS_CPATCH[11]])[0], 12: swapLegs([HS_CPATCH[12]])[0] };
ROWS.h_w1 = hsFrame({ hy: 1, leg: HS_LEG.cA, arms: [['fw', 12, 9]], patch: HS_CPATCH });
/* passagem: pe livre 2 px acima do chao, separado do pe de apoio (linhas 10-14 pintadas a mao) */
const HS_PPATCH = { 10: '....KQQPPPK.....', 11: '...KQQKPPK......', 12: '..KNNKKPPK......', 13: '...KKKOOOK......', 14: '.....KOOOOK.....' };
const HS_PPATCH_B = Object.fromEntries(Object.entries(HS_PPATCH).map(([y, r]) => [y, swapLegs([r])[0]]));
ROWS.h_w2 = hsFrame({ leg: HS_LEG.pA, arms: [['dn', 12, 7]], patch: HS_PPATCH });
ROWS.h_w3 = hsFrame({ hy: 1, leg: HS_LEG.cB, arms: [['fw', 12, 9]], patch: HS_CPATCH_B });
ROWS.h_w4 = hsFrame({ leg: HS_LEG.pB, arms: [['dn', 12, 7]], patch: HS_PPATCH_B });
ROWS.h_jump = hsFrame({ leg: HS_LEG.jump, arms: [['bk', 2, 8], ['jumpR', 0, 0]] });
ROWS.h_fall = hsFrame({ leg: HS_LEG.fall, arms: [['upL', 0, 5], ['upR', 13, 5]] });
ROWS.h_skid = hsFrame({ hx: 4, tx: 2, leg: HS_LEG.skid, arms: [['skidL', 0, 4], ['dn', 14, 8]] });
ROWS.h_land = hsFrame({ hy: 2, leg: HS_LEG.land, arms: [['bk', 2, 10], ['fw', 12, 10]] });
ROWS.h_climb1 = hsFrame({ hx: 1, tx: -1, leg: HS_LEG.climb1, arms: [['reach', 12, 6], ['grab', 12, 8]] });
ROWS.h_climb2 = hsFrame({ hx: 1, tx: -1, leg: HS_LEG.climb2, arms: [['grab', 12, 7], ['fw', 12, 8]] });
ROWS.h_die1 = hsFrame({ head: HF, hx: 3, leg: HS_LEG.die, arms: [['side', 1, 8], ['sideR', 13, 8]] });
ROWS.h_die2 = hsFrame({ head: HF, hx: 3, leg: HS_LEG.die, arms: [['dieV', 0, 1]] });
for (const k in ROWS) if (k.startsWith('h_') && (ROWS[k].length !== 16 || ROWS[k].some(r => r.length !== 16))) throw new Error('tamanho errado ' + k);

const HERO = { K: '#1c1828', C: '#20a08c', L: '#9cf0d8', M: '#127060', S: '#fcc8a0', T: '#e09870', B: '#fcc8a0', E: '#1c1828',
  P: '#c0385c', Q: '#8c2450', O: '#f8f0e0', N: '#f8f0e0' };
PAL.hero = HERO;
PAL.heroF = { ...HERO, C: '#e8401c', L: '#fcd860', M: '#981c10', P: '#fcf4e0', Q: '#c8b48c', O: '#fcd860', N: '#e8401c' };
PAL.heroS1 = { ...HERO, C: '#f8b800', L: '#fcf0a0', M: '#b07000', P: '#e84010', Q: '#a02008', O: '#fcf0a0', N: '#f8b800' };
PAL.heroS2 = { ...HERO, C: '#f83890', L: '#fcc0e0', M: '#a01858', P: '#6c2c9c', Q: '#401868', O: '#fcc0e0', N: '#f83890' };
PAL.heroS3 = { ...HERO, C: '#38c8f8', L: '#d0f8fc', M: '#1870b0', P: '#d86818', Q: '#904008', O: '#d0f8fc', N: '#38c8f8' };

/* escolha do quadro: a caminhada avanca pela distancia percorrida (um quadro a cada HERO_STEP px),
   assim o pe de apoio nao patina. HERO_WALK_B e HERO_STEP_B ficam na secao herobig. */
const HERO_WALK_S = ['w1', 'w2', 'w3', 'w4'], HERO_STEP_S = 5, STAR_PALS = ['heroS1', 'heroS2', 'heroS3', 'hero'];
function stepWalk(p, big) {
  const s = Math.abs(p.vx), d = big ? HERO_STEP_B : HERO_STEP_S;
  if (p.ground && s > 0.15) { p.walkD += s; if (p.walkD >= d) { p.walkD -= d; p.walkF = (p.walkF + 1) % 840; } }
  else p.walkD = d;
}
function heroPose(p, big) {
  if (p.state === 'die') return (p.t >> 3) & 1 ? 'die2' : 'die1';
  if (p.state === 'flag') return Math.floor(p.anim) % 2 ? 'climb2' : 'climb1';
  if (!p.ground) return p.vy < 0 ? 'jump' : 'fall';
  if (p.landT > 0) return 'land';
  if (p.skid) return 'skid';
  if (Math.abs(p.vx) > 0.15) { const w = big ? HERO_WALK_B : HERO_WALK_S; return w[p.walkF % w.length]; }
  return p.idle % 160 > 148 ? 'stand2' : 'stand';
}
function heroSprite(p, big) {
  const pose = heroPose(p, big);
  if (!big || pose.startsWith('die')) return 'h_' + pose;
  return p.throwT > 0 && ROWS['H_' + pose + '_t'] ? 'H_' + pose + '_t' : 'H_' + pose;
}
const heroPal = (p, tick) => p.star > 0 ? STAR_PALS[Math.floor(tick / (p.star < 120 ? 6 : 3)) % 4] : p.power === 2 ? 'heroF' : 'hero';
const GROW_SEQ = [16, 24, 16, 24, 32, 24, 32, 24, 32];
/* END:hero */

/* SEC:herobig */
/* ---- Heroi grande TICO (16x32): cabeca propria HB_HEAD/HB_HEAD2 (16x14, em x=0, proporcao chibi como a do pequeno); paletas da secao hero.
   Corpo em 3/4 de perfil, virado para a direita: braco de perto na frente do tronco, o de longe atras.
   Mesmas cores do heroi pequeno: K contorno, C/L moletom, S pele, P/Q calca (perto/longe), O/N tenis.
   Tudo e pintado em camadas por HB_paint; pernas, tenis, bracos e tronco ganham contorno K automatico
   (a sola K e o contato com o chao), entao as pernas se separam pela forma, pelo ceu e pelo contorno.
   O braco de perto, sobre o moletom, ganha so uma linha M na borda de tras (a da frente fica sem contorno).
   Tronco longo com giro e pernas curtas e retas (sem joelho). Caminhada de 6 fases (uma perna desenhada; a outra
   e a mesma 3 fases depois): o calcanhar de apoio recua 11 > 7 > 3, 4 px por quadro = HERO_STEP_B, entao o pe
   de apoio nao patina. ---- */
const HB_paint = parts => {
  const g = Array.from({ length: 32 }, () => new Array(16).fill('.'));
  for (const { rows, x = 0, y = 0, ol = false, y1 = -99, y2 = 99 } of parts) {
    const h = rows.length, w = rows[0].length;
    const on = (i, j) => j >= 0 && j < h && i >= 0 && i < w && rows[j][i] !== '.';
    const put = (X, Y, ch) => { if (X >= 0 && X < 16 && Y >= 0 && Y < 32 && Y >= y1 && Y <= y2) g[Y][X] = ch; };
    if (ol) for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (on(i, j) || !(on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) continue;
      const X = i + x, Y = j + y, under = X >= 0 && X < 16 && Y >= 0 && Y < 32 ? g[Y][X] : '.';
      // contorno suave: sobre o moletom, so a borda de tras do braco (pixel a esquerda dele) vira M
      if (ol === 's' && 'CLM'.includes(under)) { if (on(i + 1, j)) put(X, Y, 'M'); continue; }
      if (ol === 's' && 'PQ'.includes(under)) continue; // nao morde a calca
      put(X, Y, 'K');
    }
    rows.forEach((r, j) => { for (let i = 0; i < w; i++) if (r[i] !== '.') put(i + x, j + y, r[i]); });
  }

/* pernas: interior A com contorno K. A da frente tem garras S; a de tras tem garras e sola escuras (sombra).
   Linhas: 0 = coxa (com linha K na juncao com a armadura), 1 = canela, 2..4 = pe. xs = coluna de cada linha. */
const pgLegRows = (front, hip, shin, foot, lift) => {
  const g = Array.from({ length: 5 }, () => Array(16).fill('.'));
  const put = (y, x, t) => [...t].forEach((ch, i) => { if (ch !== '.' && x + i >= 0 && x + i < 16 && y >= 0) g[y][x + i] = ch; });
  const c = front ? 'S' : 'K';
  const footRows = ['.KAAK', c + 'KAAK', c + 'KKKK'];   // garra de 2px
  put(0, hip, 'KAAK');
  if (lift) footRows.forEach((r, i) => put(1 + i, foot, r));
  else { put(1, shin, 'KAAK'); footRows.forEach((r, i) => put(2 + i, foot, r)); }
  return g.map(r => r.join(''));
};
/* ciclo de 4 quadros de 7 ticks (3,5px a 0,5px/tick): o pe de apoio vai de 0 (frente) a 4 (passagem) e 7 (tras).
   contato: tesoura com os pes bem afastados (ceu entre eles); passagem: pernas juntas, corpo +1px. */
const pgWalk = (body, head, back, front) => compose(16, 24, [[PG_TAIL, 10, 16 + body], [PG_ARMOR, 0, body],
  [PG_HEAD, 0, 13 + head], [PG_BELLY, 4, 17 + body], [back, 0, 19], [front, 0, 19]]);
const L = pgLegRows;

ROWS.pango_c = pgWalk(-1, -1, L(false, 6, 0, 6, true), L(true, 4, 4, 4));        // passagem: frente apoiada
ROWS.pango_b = pgWalk(0, 0, L(true, 6, 7, 7), L(false, 3, 1, 0));                // contato: tras adiante
ROWS.pango_d = pgWalk(-1, -1, L(true, 6, 0, 6, true), L(false, 4, 4, 4));        // passagem: tras apoiada

/* bola: pangolim enrolado. Metade de cima com 2 fileiras de escamas em U fechadas (o mesmo motivo da
   armadura, 1px de folga do contorno); a cauda envolve meia volta (de cima/esquerda ate a diagonal de baixo/direita) como
   uma faixa de borda clara, com a ponta S e tampa K na diagonal inferior direita. Isso quebra a simetria e mostra o giro: rot90 = sentido horario = rolar para a
   direita. O brilho fixo do alto a esquerda e reaplicado em cada quadro. */
const PG_BALL = [
  '.....KKKKKK.....',

  '.....KKKKKK.....',

const PG_LIGHT = ['', '.....SSS', '...SSS', '..S', '..S', '.S'];
const pgLit = rows => rows.map((r, y) => r.replace(/./g, (ch, x) => ch === 'A' && (PG_LIGHT[y] || '')[x] === 'S' ? 'S' : ch));

/* acordando: ball0 intacta; a cabeca (focinho 1->2->3px, nariz K, olho de 2px sob a palpebra) sai DE FATO
   para fora do contorno a esquerda (linhas 8-12) e uma pata com garra S sai do lado de tras, com ceu entre
   bola, focinho e pata. Quadros de 20px: ball_peek tem a bola na coluna 3, ball_peek2 na coluna 4 (tremor).
   Virado (cabeca a direita) o espelho poe a bola de ball_peek2 na coluna 0, a mesma de ball0. Sem virar,
   a bola fica 3px a direita no quadro: pangoSprite devolve ox: 3, que o drawEnemy subtrai. */
const PG_PEEK = ['...KKKK', '..KAAAK', '.KSSKSK', 'KSSSKSK', '.KKKKKK'];
const PG_PAW = ['.KKK', 'KAAK', 'KKKS'];
const pgPeek = dx => compose(20, 16, [[ROWS.ball0, dx], [PG_PEEK, dx - 3, 8], [PG_PAW, dx + 12, 13]]);

  if (e.state === 'dead') return { id: e.shell ? 'ball0' : 'pango_x', pal: 'pango', flip: e.dir > 0, vflip: true };
  if (e.state === 'walk') return { id: PG_WALK[Math.floor(e.anim / 7) % 4], pal: 'pango', flip: e.dir > 0 };
  if (e.state === 'shellmove') return { id: 'ball' + (((Math.floor(e.roll / 6) % 4) + 4) % 4), pal: 'pango' };
  /* enrolado: quieto, espia de vez em quando e, perto de PANGO_UNROLL, espia direto tremendo cada vez mais rapido */
  const T0 = e.shellT, flip = px > e.x, warn = T0 >= PANGO_UNROLL - 90;
  const t = T0 % 150;
  if (!warn && (T0 < 60 || t <= 105)) return { id: 'ball0', pal: 'pango', flip };
  const per = !warn ? 3 : T0 >= PANGO_UNROLL - 30 ? 1 : 2;
  const shake = Math.floor(T0 / per) % 2 === 1;              // virado, ball_peek2 e o quadro "parado"
  return { id: shake !== flip ? 'ball_peek2' : 'ball_peek', pal: 'pango', flip, ox: flip ? 0 : 3 };

  sfx.flag();
}

/* ---------------------------- ENTIDADES ---------------------------- */
function updateEntities() {
  for (const b of bumps) b.t++; bumps = bumps.filter(b => b.t < 12);
  for (const c of coinPops) {
    c.vy += 0.4; c.y += c.vy; c.t++;
    if (c.vy > 0 && c.y >= c.base + 16 - 4) { c.rm = true; popups.push({ x: c.x, y: c.base, txt: '200', t: 0 }); sparkle(c.x + 4, c.y + 6); }
  }
  coinPops = coinPops.filter(c => !c.rm);
  for (const d of debris) { d.vy += 0.3; d.x += d.vx; d.y += d.vy; d.t++; } debris = debris.filter(d => d.y < H + 20);
  for (const s of popups) { s.t++; s.y -= 0.6; } popups = popups.filter(s => s.t < 45);
  for (const q of parts) { q.t++; q.x += q.vx; q.y += q.vy; if (q.g) q.vy += q.g; } parts = parts.filter(q => q.t < q.life);

  for (const it of items) {
    if (it.emerge > 0) { it.y -= 0.5; it.emerge -= 0.5; continue; }
    if (!it.started) { it.started = true; if (it.type !== 'fire') { it.vx = it.dir * (it.type === 'star' ? 1.3 : 0.9); if (it.type === 'star') it.vy = -3.5; } }
    if (it.type !== 'fire') {
      it.vy = Math.min(it.vy + (it.type === 'star' ? 0.18 : 0.25), 4);
      if (it.vx !== 0 && moveX(it)) { it.vx = -it.vx; it.dir = -it.dir; }
      const r = moveY(it); if (r.down && it.type === 'star') it.vy = -3.6;
    }
    if (it.type === 'star' && G.tick % 6 === 0) sparkle(it.x + rnd(0, 16), it.y + rnd(0, 16), '#fcd848');
    if (it.type === 'grow' && G.tick % 50 === 0) sparkle(it.x + 5, it.y + 7);
    if (it.y > H + 20) it.rm = true;
    if (!it.rm && overlap(p, it) && p.state === 'play') collect(it);
  }
  items = items.filter(i => !i.rm);

  for (const f of fireballs) {
    f.t++; f.vy = Math.min(f.vy + 0.3, 3.8);
    if (moveX(f)) f.rm = f.poof = true;
    const r = moveY(f); if (r.down) f.vy = -3; if (r.up) f.rm = f.poof = true;
    if (f.x < camX - 8 || f.x > camX + W + 8 || f.y > H) f.rm = true;
    for (const e of enemies) {
      if (!e.active || e.state === 'dead' || e.state === 'squish') continue;
      if (overlap(f, e)) { flipKill(e, 100); f.rm = f.poof = true; break; }
    }
    if (f.poof) poof(f.x + 4, f.y + 4);
  }
  fireballs = fireballs.filter(f => !f.rm);

  for (const e of enemies) {
    if (!e.active) { if (e.x < camX + W + 24) e.active = true; else continue; }
    if (e.state === 'dead') { e.vy += 0.3; e.y += e.vy; e.x += e.vx; if (e.y > H + 40) e.rm = true; continue; }
    if (e.state === 'squish') { if (--e.t <= 0) e.rm = true; continue; }
    e.anim++; if (e.kickT > 0) e.kickT--;
    if (e.state === 'shell' && ++e.shellT >= PANGO_UNROLL) unroll(e);
    e.vx = e.state === 'shellmove' ? e.dir * 4.2 : e.state === 'shell' ? 0 : e.dir * 0.5;
    e.vy = Math.min(e.vy + 0.25, 4);
    const hit = moveX(e); if (hit) { e.dir = hit > 0 ? -1 : 1; if (e.state === 'shellmove') { sfx.bump(); burst(e.x + (hit > 0 ? e.w : 0), e.y + 8); } }
    if (e.state === 'shellmove') e.roll += e.vx;
    moveY(e);
    if (e.y > H + 20 || e.x < camX - 64) { e.rm = true; continue; }
    if (e.state === 'shellmove') for (const o of enemies) {
      if (o === e || !o.active || o.state === 'dead' || o.state === 'squish') continue;
      if (overlap(e, o)) flipKill(o, 500);
    }
  }
  if (p.state === 'play') for (const e of enemies) {
    if (e.rm || !e.active || e.state === 'dead' || e.state === 'squish' || !overlap(p, e)) continue;
    if (p.star > 0) { flipKill(e, 200); continue; }
    const stomp = p.vy > 0 && p.prevBottom <= e.y + 10;
    if (stomp) {
      p.vy = any(keys, JUMP) ? -4.4 : -3; p.y = e.y - p.h; p.jumping = any(keys, JUMP);
      const pts = [100, 200, 400, 500, 800, 1000, 2000, 4000, 5000, 8000][Math.min(p.chain, 9)];
      if (p.chain >= 10) oneUp(e.x, e.y); else addScore(pts, e.x, e.y);
      p.chain++; sfx.stomp(); burst(e.x + e.w / 2, e.y);
      if (e.type === 'blob') { e.state = 'squish'; e.t = 30; e.vx = 0; goo(e.x + e.w / 2, e.y + e.h - 3); }
      else if (e.state === 'walk') { e.state = 'shell'; e.shell = true; e.vx = 0; e.shellT = 0; }
      else if (e.state === 'shell') { e.state = 'shellmove'; e.dir = (p.x + p.w / 2 < e.x + e.w / 2) ? 1 : -1; e.kickT = 12; }
      else if (e.state === 'shellmove') { e.state = 'shell'; e.shellT = 0; }
    } else if (e.type === 'pango' && e.state === 'shell') {
      e.state = 'shellmove'; e.dir = (p.x + p.w / 2 < e.x + e.w / 2) ? 1 : -1; e.kickT = 12; addScore(400, e.x, e.y); sfx.kick(); burst(e.x + e.w / 2, e.y + 8);
    } else if (e.state === 'shellmove' && e.kickT > 0) { /* gracia */ }
    else hurt();
  }
  enemies = enemies.filter(e => !e.rm);
}
function collect(it) {
  it.rm = true;
  for (let i = 0; i < 4; i++) sparkle(it.x + rnd(0, 16), it.y + rnd(0, 16));
  if (it.type === 'grow') { addScore(1000, it.x, it.y); if (p.power === 0) grow(1); else sfx.power(); }
  else if (it.type === 'fire') { addScore(1000, it.x, it.y); grow(2); }
  else if (it.type === 'life') oneUp(it.x, it.y);
  else if (it.type === 'star') { addScore(1000, it.x, it.y); p.star = 600; sfx.power(); }
}

/* ------------------------------ UPDATE ------------------------------ */
function update() {
  G.tick++;
  if (G.mode === 'title') { if (any(pressed, START)) startGame(); }
  else if (G.mode === 'intro') { if (--G.timer <= 0) G.mode = 'play'; }
  else if (G.mode === 'gameover') { if (--G.timer <= 0) G.mode = 'title'; }
  else if (G.mode === 'clear') { if (pressed.Enter || pressed.Space || pressed.TJump) startGame(); }
  else if (G.mode === 'play') updatePlay();
  for (const k in pressed) delete pressed[k];
}
function updatePlay() {
  if (pressed.KeyP || pressed.Escape) G.paused = !G.paused;
  if (G.paused) return;
  if (p.state === 'play' && p.freeze <= 0 && ++G.tc >= 24) { G.tc = 0; if (--G.time <= 0) { G.time = 0; die(); } }
  if (p.freeze > 0) { p.freeze--; return; }
  updatePlayer();
  if (p.state === 'die') return;
  updateEntities();
  if (camX < LW * T - W && p.x - camX > 112) camX = Math.min(p.x - 112, LW * T - W);
}

/* ------------------------------ DESENHO ------------------------------ */
function txt(s, x, y, col = '#fff', size) {
  ctx.font = size ? size + 'px "Press Start 2P", monospace' : FONT;
  ctx.textBaseline = 'top'; ctx.fillStyle = col; ctx.fillText(s, Math.round(x), Math.round(y));
}
function txtC(s, y, col, size) { ctx.font = size ? size + 'px "Press Start 2P", monospace' : FONT; const w = ctx.measureText(s).width; txt(s, (W - w) / 2, y, col, size); }
function drawDecor() {
  for (let k = 0; k < 5; k++) {
    const o = k * 48 * T;
    ctx.drawImage(DECOR.hillL, Math.round(o - camX), 208 - 35);
    ctx.drawImage(DECOR.hillS, Math.round(o + 16 * T - camX), 208 - 19);
    ctx.drawImage(DECOR.bush3, Math.round(o + 11 * T - camX), 208 - 16);
    ctx.drawImage(DECOR.bush2, Math.round(o + 23 * T - camX), 208 - 16);
    ctx.drawImage(DECOR.bush1, Math.round(o + 41 * T - camX), 208 - 16);
    [[8, 3, 'S'], [19, 2, 'L'], [27, 3, 'S'], [36, 2, 'L'], [43, 3, 'S']].forEach(c => ctx.drawImage(DECOR['cloud' + c[2]], Math.round(o + c[0] * T - camX), c[1] * T));
  }
  ctx.drawImage(DECOR.hillL, Math.round(240 * T - camX), 208 - 35);
}
function drawCastle() {
  const x0 = 202 * T - camX;
  for (let c = 0; c < 5; c++) for (let r = 11; r <= 12; r++) ctx.drawImage(TILE[2], Math.round(x0 + c * T), r * T);
  for (let c = 0; c < 5; c++) ctx.drawImage(TILE[2], Math.round(x0 + c * T), 10 * T);
  for (const c of [0, 2, 4]) ctx.drawImage(TILE[2], Math.round(x0 + c * T), 9 * T);
  ctx.fillStyle = '#000';
  ctx.fillRect(Math.round(x0 + 2 * T), 12 * T - 8, 16, 24); ctx.fillRect(Math.round(x0 + 2 * T + 2), 12 * T - 10, 12, 4);
  ctx.fillRect(Math.round(x0 + T + 4), 10 * T + 3, 8, 10); ctx.fillRect(Math.round(x0 + 3 * T + 4), 10 * T + 3, 8, 10);
  ctx.fillStyle = '#fcfcfc'; ctx.fillRect(Math.round(x0 + 2 * T + 7), 8 * T + 2, 2, 14);
  ctx.fillStyle = '#00a800'; ctx.fillRect(Math.round(x0 + 2 * T + 9), 8 * T + 2, 8, 6);
}
function drawFlagPole() {
  const x = POLE + 7 - camX;
  ctx.fillStyle = '#80d010'; ctx.fillRect(Math.round(x), 48, 2, 144);
  ctx.fillStyle = '#00a800'; ctx.fillRect(Math.round(x - 1), 41, 4, 5); ctx.fillRect(Math.round(x), 40, 2, 7);
  const fy = G.flagY;
  for (let r = 0; r < 16; r++) {
    const w = Math.round(16 - Math.abs(7.5 - r) * 2 + Math.sin(G.tick / 6 - r / 3) * (16 - Math.abs(7.5 - r) * 2) / 10);
    ctx.fillStyle = '#fcfcfc'; ctx.fillRect(Math.round(x - w), fy + r, w, 1);
  }
  ctx.fillStyle = '#00a800'; ctx.fillRect(Math.round(x - 9 + Math.sin(G.tick / 6 - 2.5)), fy + 6, 4, 4);
}
function drawItem(it) {
  const f = itemSprite(it, G.tick);
  drawSpr(f.id, f.pal, it.x, it.y, false);
}
function drawTiles() {
  const bm = {}; for (const b of bumps) bm[b.tx + ',' + b.ty] = -Math.round(Math.sin(b.t / 12 * Math.PI) * 6);
  const t0 = Math.max(0, Math.floor(camX / T)), t1 = Math.min(LW - 1, t0 + 17);
  const qf = Math.floor(G.tick / 8) % 4;
  for (let ty = 0; ty < 15; ty++) for (let tx = t0; tx <= t1; tx++) {
    const t = map[ty][tx]; if (!t || t === 10) continue;
    const img = t === 3 ? TILE.q[qf] : TILE[t];
    ctx.drawImage(img, Math.round(tx * T - camX), ty * T + (bm[tx + ',' + ty] || 0));
  }
}
function drawEnemy(e) {
  const f = enemySprite(e, G.tick, p.x), im = spr(f.id, f.pal, f.flip, f.vflip);
  /* alinhado pela base da hitbox: quadros mais altos que ela (pango andando) sobem acima de e.y;
     virado de cabeca para baixo, a arte (que encosta na base do quadro) fica no topo: alinha pelo topo */
  ctx.drawImage(im, Math.round(e.x - 1 - (f.ox || 0) - camX), Math.round(f.vflip ? e.y : e.y + e.h - im.height));
}
function drawPlayer() {
  if (p.state === 'bonus') return;
  if (p.inv > 0 && p.state === 'play' && p.freeze <= 0 && (G.tick >> 2) & 1) return;
  const flip = p.dir < 0, x = Math.round(p.x - 2 - camX), bottom = Math.round(p.y + p.h);
  let pal = heroPal(p, G.tick), big = p.h === 32 && p.state !== 'die';
  if (p.freeze > 0 && p.fx === 'fire') pal = (p.freeze >> 2) & 1 ? 'heroF' : 'hero';
  else if (p.freeze > 0 && p.fx) {
    /* crescer/encolher: alterna pequeno, meio-termo esticado e grande */
    let hh = GROW_SEQ[Math.min(8, Math.floor((45 - p.freeze) / 5))];
    if (p.fx === 'shrink') hh = 48 - hh;
    ctx.drawImage(spr(heroSprite(p, hh > 16), pal, flip), x, bottom - hh, 16, hh);
    return;
  }
  const im = spr(heroSprite(p, big), pal, flip);
  ctx.drawImage(im, x, bottom - im.height);
}
function drawWorld() {
  ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, W, H);
  drawDecor(); drawCastle(); drawFlagPole();
  /* item saindo do bloco: so a parte acima do topo do bloco em repouso aparece (nao vaza por baixo no bump) */
  for (const it of items) if (it.emerge > 0) { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, it.top); ctx.clip(); drawItem(it); ctx.restore(); }
  drawTiles();
  for (const c of coinPops) drawSpr(coinSprite(c.t), 'coin', c.x, c.y, false);
  for (const it of items) if (it.emerge <= 0) drawItem(it);
  for (const e of enemies) if (e.active) drawEnemy(e);
  for (const f of fireballs) drawSpr(fireSprite(f), 'fire', f.x, f.y, false);
  for (const d of debris) drawSpr(debSprite(d), 'deb', d.x, d.y, d.vx < 0);
  drawPlayer();
  for (const q of parts) drawPart(ctx, q, camX);
  for (const s of popups) txt(s.txt, s.x - camX, s.y, '#fff', 8);
}
function hud() {
  txt(HERO_NAME, 24, 16); txt(String(G.score).padStart(6, '0'), 24, 24);
  ctx.fillStyle = (G.tick >> 3) & 1 ? '#fcc43c' : '#e0a000'; ctx.fillRect(89, 24, 5, 8);
  txt('x' + String(G.coins).padStart(2, '0'), 96, 24);
  txt('WORLD', 144, 16); txt(' 1-1', 144, 24);
  txt('TIME', 200, 16); txt(G.mode === 'title' ? '' : String(G.time).padStart(3, ' '), 208, 24);
}
function render() {
  if (G.mode === 'intro' || G.mode === 'gameover') {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); hud();
    if (G.mode === 'intro') {
      txtC('WORLD 1-1', 80); ctx.drawImage(spr('h_stand', 'hero', false), 96, 112); txt('x  ' + G.lives, 120, 120);
    } else txtC('GAME OVER', 112);
    return;
  }
  if (G.mode === 'title') {
    if (!map) { buildLevel(); resetPlayer(); }
    drawWorld(); hud();
    txtC('SUPER', 40, '#000', 24); txtC('SUPER', 38, '#fcfcfc', 24);
    txtC('MARIO BROS', 72, '#000', 16); txtC('MARIO BROS', 70, '#fc9838', 16);
    txtC('FASE 1-1  (CLONE)', 100, '#fff');
    if ((G.tick >> 5) & 1) txtC('PRESSIONE ENTER', 124, '#fff');
    ctx.fillStyle = '#0008'; ctx.fillRect(0, 150, W, 50);
    txtC('SETAS/AWD: MOVER', 156); txtC('ESPACO/Z: PULAR', 168); txtC('SHIFT/X: CORRER E FOGO', 180);
    txtC('P: PAUSA   M: SOM', 192);
    return;
  }
  drawWorld(); hud();
  if (G.paused) { ctx.fillStyle = '#0006'; ctx.fillRect(0, 0, W, H); txtC('PAUSADO', 112); }
  if (G.mode === 'clear') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 70, W, 100);
    txtC('FASE 1-1 COMPLETA!', 84, '#fcc43c'); txtC('PONTOS ' + String(G.score).padStart(6, '0'), 108);
    if ((G.tick >> 5) & 1) txtC('ENTER: JOGAR DE NOVO', 140);
  }
}

/* ------------------------------- LOOP ------------------------------- */
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  render(); requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve()).then(() => {
  buildLevel(); resetPlayer(); requestAnimationFrame(frame);
});
</script>
