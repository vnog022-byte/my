<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1b1d24}</style><script>window.__errs=[];window.onerror=function(m,s,l,c){window.__errs.push(m+' (linha '+l+':'+c+')');};</script></head><body>
<script>
'use strict';
/* ART-BEGIN */
/* ----------------------------- ARTE -----------------------------
   Personagens originais desenhados em texto: cada letra e uma cor da paleta.
   compose() monta um quadro a partir de pedacos (cabeca, tronco, pernas, bracos).
   Cada secao (SEC:nome ... END:nome) guarda os desenhos e a escolha de quadro de um elemento. */
const compose = (w, h, parts) => {
  const g = Array.from({ length: h }, () => new Array(w).fill('.'));
  for (const [rows, dx = 0, dy = 0] of parts) rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) { const ch = r[x], X = x + dx, Y = y + dy; if (ch !== '.' && Y >= 0 && Y < h && X >= 0 && X < w) g[Y][X] = ch; }
  });
  return g.map(r => r.join(''));
};
const mirror = rows => rows.map(r => [...r].reverse().join(''));
const rot90 = rows => [...rows[0]].map((_, x) => rows.map(r => r[x]).reverse().join(''));
const recolor = (rows, m) => rows.map(r => r.replace(/./g, ch => m[ch] || ch));
const shade = rows => recolor(rows, { C: 'M', S: 'T' });
const swapLegs = rows => recolor(rows, { P: 'Q', Q: 'P', O: 'N', N: 'O' });
const ROWS = {}, PAL = {};
const sprCache = new Map();
function spr(id, pal, flip, vflip) {
  const key = id + '|' + pal + '|' + (flip ? 1 : 0) + (vflip ? 1 : 0);
  let c = sprCache.get(key); if (c) return c;
  const rows = ROWS[id], P = PAL[pal], w = rows[0].length, h = rows.length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
    const ch = rows[r][q]; if (ch === '.' || !P[ch]) continue;
    x.fillStyle = P[ch]; x.fillRect(flip ? w - 1 - q : q, vflip ? h - 1 - r : r, 1, 1);
  }
  sprCache.set(key, c); return c;
}

/* SEC:hero */
/* ---- Heroi pequeno (16x16), cabeca e paletas compartilhadas, e escolha de quadro do heroi.
   K=contorno C=moletom L=borda M=moletom escuro S=pele T=pele escura B=bochecha E=olho P/Q=calca O/N=tenis
   Caminhada classica: contato (pernas em V, corpo 1 px abaixo) e passagem (perna de apoio reta, a outra
   passando com o pe levantado), alternando as pernas. Pernas sem contorno interno. ---- */
const HH = [
  '.K......K...', 'KCK....KCK..', 'KCCKKKKKCCK.', 'KCCCLLLLLCCK',
  'KCCLSSSSESLK', 'KCCLSSSBESSK', '.KCCLLLLLLK.'];
const HH2 = ['.K..........', 'KCK.....KKK.', 'KCCKKKKKCCCK'].concat(HH.slice(3));
const HF = [
  '...K........K...', '..KCK......KCK..', '..KCCKKKKKKCCK..', '.KCCLLLLLLLLCCK.',
  '.KCLSESSSSESLCK.', '.KCLSSSKKSSSLCK.', '..KCLLLLLLLLCK..'];
const ST = {
  stand: ['...KCCCCCCCCK...', '...SKCCCCCCKS...', '....KLLLLLLK....'],
  plain: ['...KCCCCCCCCK...', '...KCCCCCCCCK...', '....KLLLLLLK....'],
  swA:   ['...KCCCCCCCCK...', '..SKCCCCCCCCKT..', '....KLLLLLLK....'],
  swB:   ['...KCCCCCCCCK...', '..TKCCCCCCCCKS..', '....KLLLLLLK....'],
  jump:  ['...KCCCCCCCCK...', '..TKCCCCCCCCK...', '....KLLLLLLK....'],
  skid:  ['....KCCCCCCCCK..', '...TKCCCCCCCCKS.', '.....KLLLLLLK...'],
  climb1:['...KCCCCCCCCKS..', '...KCCCCCCCCK...', '....KLLLLLLKS...'],
  climb2:['...KCCCCCCCCK...', '...KCCCCCCCCKS..', '....KLLLLLLK.S..'],
  die:   ['S..KCCCCCCCCK..S', '.SKCCCCCCCCCCKS.', '...KLLLLLLLLK...'],
};
/* quadril + pernas + tenis (6 linhas na altura normal, 5 quando o corpo desce 1 px) */
const SL = {
  stand: ['....KPPPPPPK....', '.....QQ..PP.....', '.....QQ..PP.....', '.....QQ..PP.....', '.....QQ..PP.....', '.....NNN.OOO....'],
  cA:    ['....KPPPPPPK....', '.....QQ..PP.....', '....QQ....PP....', '...QQ......PP...', '..NNN......OOO..'],
  pA:    ['....KPPPPPPK....', '......QQPP......', '......QQPP......', '.....QQ.PP......', '....NNN.PP......', '........OOO.....'],
  jump:  ['....KPPPPPPK....', '.....QQPPPP.....', '.....QQ...PP....', '....QQ....PP....', '....QQ....OOO...', '...NNN..........'],
  fall:  ['....KPPPPPPK....', '.....QQ..PP.....', '.....QQ..PP.....', '....QQ....PP....', '....QQ....PP....', '...NNN....OOO...'],
  skid:  ['.....KPPPPPPK...', '.....QQ.PP......', '....QQ.PP.......', '...QQ.PP........', '..QQ.PP.........', '.NNNOOO.........'],
  land:  ['...KPPPPPPPPK...', '...QQ......PP...', '..QQ........PP..', '..NNN......OOO..'],
  climb1:['....KPPPPPPK....', '.....QQPPPP.....', '.....QQ...PP....', '.....QQ...OOOO..', '.....QQ.........', '....NNN.........'],
  die:   ['....KPPPPPPK....', '.....PP..PP.....', '.....PP..PP.....', '.....PP..PP.....', '.....PP..PP.....', '....OOO..OOO....'],
};
SL.cB = swapLegs(SL.cA); SL.pB = swapLegs(SL.pA); SL.climb2 = swapLegs(SL.climb1);
const ARM_UP_R = [['..S', '..S', '.CK', 'C..'], 12, 4], ARM_UP_L = [['S...', 'S...', '.C..', '..CC'], 0, 4];
const small = (head, hx, torso, legs, dy = 0, extra = []) => compose(16, 16, [[head, hx, dy], [torso, 0, 7 + dy], [legs, 0, 16 - legs.length], ...extra]);
ROWS.h_stand = small(HH, 2, ST.stand, SL.stand);
ROWS.h_stand2 = small(HH2, 2, ST.stand, SL.stand);
ROWS.h_w1 = small(HH, 2, ST.swA, SL.cA, 1);
ROWS.h_w2 = small(HH, 2, ST.stand, SL.pA);
ROWS.h_w3 = small(HH, 2, ST.swB, SL.cB, 1);
ROWS.h_w4 = small(HH, 2, ST.stand, SL.pB);
ROWS.h_jump = small(HH, 2, ST.jump, SL.jump, 0, [ARM_UP_R]);
ROWS.h_fall = small(HH, 2, ST.plain, SL.fall, 0, [ARM_UP_L, ARM_UP_R]);
ROWS.h_skid = small(HH, 3, ST.skid, SL.skid);
ROWS.h_land = small(HH, 2, ST.stand, SL.land, 2);
ROWS.h_climb1 = small(HH, 2, ST.climb1, SL.climb1);
ROWS.h_climb2 = small(HH, 2, ST.climb2, SL.climb2);
ROWS.h_die1 = compose(16, 16, [[HF], [ST.die, 0, 7], [SL.die, 0, 10]]);
ROWS.h_die2 = compose(16, 16, [[HF], [['S..............S', 'S..............S', 'C..............C', '.C............C.', '..CC........CC..'], 0, 3], [ST.plain, 0, 7], [SL.die, 0, 10]]);

const HERO = { K: '#1c1828', C: '#20a08c', L: '#9cf0d8', M: '#127060', S: '#fcc8a0', T: '#d89878', B: '#f87860', E: '#1c1828', P: '#3c4ca8', Q: '#283070', O: '#f87818', N: '#b84808' };
PAL.hero = HERO;
PAL.heroF = { ...HERO, C: '#e8401c', L: '#fcd860', M: '#981c10', O: '#fcd860', N: '#c89820' };
PAL.heroS1 = { ...HERO, C: '#f8b800', L: '#fcf0a0', M: '#b07000', P: '#e84010', Q: '#a02008' };
PAL.heroS2 = { ...HERO, C: '#f83890', L: '#fcc0e0', M: '#a01858' };
PAL.heroS3 = { ...HERO, C: '#38c8f8', L: '#d0f8fc', M: '#1870b0', P: '#fcfcfc', Q: '#a8a8b8' };

/* escolha do quadro: a caminhada avanca pela distancia percorrida (um quadro a cada HERO_STEP px),
   assim o pe de apoio nao patina. HERO_WALK_B e HERO_STEP_B ficam na secao herobig. */
const HERO_WALK_S = ['w1', 'w2', 'w3', 'w4'], HERO_STEP_S = 4.5, STAR_PALS = ['heroS1', 'heroS2', 'heroS3', 'hero'];
function stepWalk(p, big) {
  const s = Math.abs(p.vx), d = big ? HERO_STEP_B : HERO_STEP_S;
  if (p.ground && s > 0.15) { p.walkD += s; if (p.walkD >= d) { p.walkD -= d; p.walkF = (p.walkF + 1) % 840; } }
  else p.walkD = d;
}
function heroPose(p, big) {
  if (p.state === 'die') return (p.t >> 3) & 1 ? 'die2' : 'die1';
  if (p.state === 'flag') return Math.floor(p.anim) % 2 ? 'climb2' : 'climb1';
  if (!p.ground) return p.vy < 0 ? 'jump' : 'fall';
  if (p.landT > 0) return 'land';
  if (p.skid) return 'skid';
  if (Math.abs(p.vx) > 0.15) { const w = big ? HERO_WALK_B : HERO_WALK_S; return w[p.walkF % w.length]; }
  return p.idle % 160 > 148 ? 'stand2' : 'stand';
}
function heroSprite(p, big) {
  const pose = heroPose(p, big);
  if (!big || pose.startsWith('die')) return 'h_' + pose;
  return p.throwT > 0 && ROWS['H_' + pose + '_t'] ? 'H_' + pose + '_t' : 'H_' + pose;
}
const heroPal = (p, tick) => p.star > 0 ? STAR_PALS[Math.floor(tick / (p.star < 120 ? 6 : 3)) % 4] : p.power === 2 ? 'heroF' : 'hero';
const GROW_SEQ = [16, 24, 16, 24, 32, 24, 32, 24, 32];
/* END:hero */

/* SEC:herobig */
/* ---- Heroi grande TICO (16x32): cabeca HH/HH2 (12x7, em x=2) e paletas da secao hero.
   Corpo em 3/4 de perfil: moletom com 11 linhas (7-17), pernas com 14 (18-31).
   As partes sao desenhadas so com o preenchimento; o contorno e gerado sozinho
   ('k' = contorno preto; 's' = contorno suave, que vira M quando cai sobre o moletom). ---- */
const HB_paint = parts => {
  const g = Array.from({ length: 32 }, () => new Array(16).fill('.'));
  const put = (X, Y, ch) => { if (X >= 0 && X < 16 && Y >= 0 && Y < 32) g[Y][X] = ch; };
  for (const [rows, dx = 0, dy = 0, ol = ''] of parts) {
    const h = rows.length, w = rows[0].length;
    const on = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== '.';
    if (ol) for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
      if (on(x, y) || !(on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) continue;
      const X = x + dx, Y = y + dy;
      if (X >= 0 && X < 16 && Y >= 0 && Y < 32) put(X, Y, ol === 's' && 'CLM'.includes(g[Y][X]) ? 'M' : 'K');
    }
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) if (r[x] !== '.') put(x + dx, y + dy, r[x]); });
  }
  return g.map(r => r.join(''));
};
/* moletom (linhas 7-17) */
const HB_TORSO = [
  '...KCCCCCCCCK...',
  '...KCCCCCCCCK...',
  '...KCCCCCCCCCK..',
  '...KCCCCCCCCCK..',
  '...KCCCCCCCCMK..',
  '...KCCCCCCCCMK..',
  '...KCCCCCCCCMK..',
  '...KCCCCCCCMK...',
  '...KCCCCCCCMK...',
  '...KMMMMMMMMK...',
  '....KLLLLLLK....'];
/* bracos (so preenchimento; [linhas, x, y]) */
const HB_ARM = {
  B2: [['...LC', '..CCC', '..CCC', '.CCC.', '.CC..', 'CC...', 'LL...', 'SS...', 'ST...'], 3, 8],
  B1: [['..LC', '.CCC', '.CCC', '.CC.', '.CC.', 'CC..', 'LL..', 'SS..', 'ST..'], 4, 8],
  D:  [['LC.', 'CCC', 'CCC', 'CC.', 'CC.', 'CC.', '.CC', '.LL', '.SS', '.ST'], 6, 8],
  F1: [['LC..', 'CCC.', 'CCC.', '.CC.', '.CC.', '.CCC', '..LL', '..SS', '..ST'], 6, 8],
  F2: [['LC....', 'CCC...', '.CCC..', '..CC..', '..CCC.', '...CCL', '....LS', '....SS'], 6, 8],
  T:  [['LC.......', 'CCCCC....', 'CCCCCCLSS', '...CCCLST'], 6, 8],
};
/* pernas: 8 fases de uma perna (desenhada como a perna de perto, P/O), linhas 18-30; a 31 e a sola (contorno) */
const HB_LEG = [
  // 0 contato: calcanhar em 12, ponta do pe levantada
  ['.....PPP........', '.....PPP........', '......PPP.......', '......PPP.......', '.......PPP......', '.......PPP......',
   '........PP......', '.........PP.....', '.........PP.....', '..........PP....', '..........PP....', '...........OOOO.', '...........OO...'],
  // 1 carga: pe chato (calcanhar 9), joelho um pouco dobrado
  ['.....PPP........', '.....PPP........', '......PPP.......', '......PPP.......', '......PPP.......', '.......PPP......',
   '.......PP.......', '........PP......', '........PP......', '........PP......', '.........PP.....', '.........OOO....', '.........OOOO...'],
  // 2 passagem (apoio): perna reta embaixo do quadril (calcanhar 6)
  ['.....PPP........', '.....PPP........', '.....PPP........', '.....PPP........', '......PP........', '......PP........',
   '......PP........', '.....PPP........', '.....PPP........', '......PP........', '......PP........', '......OOO.......', '......OOOO......'],
  // 3 impulso: calcanhar subindo, ponta em 4-6
  ['.....PPP........', '.....PPP........', '....PPP.........', '....PPP.........', '....PP..........', '....PP..........',
   '...PP...........', '...PPP..........', '...PP...........', '...PP...........', '...OO...........', '...OOO..........', '....OOO.........'],
  // 4 saida: so a ponta (3) no chao
  ['.....PPP........', '.....PPP........', '....PPP.........', '....PPP.........', '...PPP..........', '...PP...........',
   '..PP............', '..PP............', '.PP.............', '.PP.............', '.OO.............', '.OOO............', '..OO............'],
  // 5 balanco: pe solto atras, joelho dobrando
  ['.....PPP........', '.....PPP........', '.....PPP........', '.....PPP........', '.....PP.........', '.....PP.........',
   '....PP..........', '...PP...........', '..PP............', '.PP.............', '.OOO............', '..OOO...........', '................'],
  // 6 passagem (balanco): joelho para frente, pe levantado
  ['.....PPP........', '.....PPP........', '......PPP.......', '......PPP.......', '.......PPP......', '........PP......',
   '.......PP.......', '......PP........', '.....PP.........', '....OOOO........', '.....OOO........', '................', '................'],
  // 7 alcance: perna se estica para frente, pe um pouco acima do chao
  ['.....PPP........', '.....PPP........', '......PPP.......', '......PPP.......', '.......PPP......', '.......PPP......',
   '........PP......', '........PP......', '.........PP.....', '.........PP.....', '..........OOO...', '..........OOOO..', '................'],
];
const HB_far = rows => recolor(rows, { P: 'Q', O: 'N' });
const HB_BOB = [1, 1, 0, 0];
const HB_ARMSEQ = ['B2', 'B1', 'D', 'F1', 'F2', 'F1', 'D', 'B1'];
const HB_shade = rows => recolor(rows, { C: 'M', L: 'M', S: 'T' });
/* monta um quadro: braco de longe, pernas (de longe, de perto), tronco, cabeca, braco de perto */
const HB_frame = (near, far, armN, armF, dy, head = HH) => HB_paint([
  [HB_shade(armF[0]), armF[1] + 2, armF[2] + dy, 'k'],
  [HB_far(far), 0, 18, 'k'],
  [near, 0, 18, 'k'],
  [HB_TORSO, 0, 7 + dy],
  [head, 2, dy],
  [armN[0], armN[1], armN[2] + dy, 'k'],
]);
const HERO_WALK_B = ['w1', 'w2', 'w3', 'w4', 'w5', 'w6', 'w7', 'w8'], HERO_STEP_B = 3;
for (let f = 0; f < 8; f++) {
  const near = HB_LEG[f], far = HB_LEG[(f + 4) % 8], dy = HB_BOB[f % 4];
  const aN = HB_ARM[HB_ARMSEQ[f]], aF = HB_ARM[HB_ARMSEQ[(f + 4) % 8]];
  ROWS['H_' + HERO_WALK_B[f]] = HB_frame(near, far, aN, aF, dy);
  ROWS['H_' + HERO_WALK_B[f] + '_t'] = HB_frame(near, far, HB_ARM.T, aF, dy);
}
/* parado */
const HB_STAND_N = ['......PPP.......', '......PPP.......', '......PPP.......', '......PPP.......', '.......PP.......', '.......PP.......',
  '.......PP.......', '......PPP.......', '......PPP.......', '.......PP.......', '.......PP.......', '.......OOO......', '.......OOOO.....'];
const HB_STAND_F = ['....PPP.........', '....PPP.........', '....PPP.........', '....PPP.........', '....PP..........', '....PP..........',
  '....PP..........', '...PPP..........', '...PPP..........', '....PP..........', '....PP..........', '....OOO.........', '....OOOO........'];
ROWS.H_stand = HB_frame(HB_STAND_N, HB_STAND_F, HB_ARM.D, HB_ARM.D, 0);
ROWS.H_stand2 = HB_frame(HB_STAND_N, HB_STAND_F, HB_ARM.D, HB_ARM.D, 0, HH2);
ROWS.H_stand_t = HB_frame(HB_STAND_N, HB_STAND_F, HB_ARM.T, HB_ARM.D, 0);
ROWS.H_stand2_t = HB_frame(HB_STAND_N, HB_STAND_F, HB_ARM.T, HB_ARM.D, 0, HH2);
/* acoes (provisorio) */
for (const k of ['jump', 'fall', 'skid', 'land', 'climb1', 'climb2']) {
  ROWS['H_' + k] = HB_frame(HB_LEG[k === 'jump' ? 6 : 1], HB_LEG[k === 'jump' ? 3 : 5], HB_ARM.F2, HB_ARM.B2, 0);
  if (!k.startsWith('climb')) ROWS['H_' + k + '_t'] = HB_frame(HB_LEG[1], HB_LEG[5], HB_ARM.T, HB_ARM.B2, 0);
}
/* END:herobig */

/* SEC:blob */
/* ---- Gosma (anda esticando e achatando): K=contorno B=corpo L=brilho M=sombra W=olho E=pupila V/U=broto ---- */
ROWS.blob_n = [
  '................', '................', '........VV......', '.......VUK......', '.....KKKKKK.....', '...KKBBBBBBKK...',
  '..KBBLLBBBBBBK..', '.KBBLLBBBBBBBBK.', '.KBLLBBBBBBBBBK.', '.KBEWWBBBEWWBBK.', '.KBEWWBBBEWWBBK.', '.KBBBBBBBBBBBBK.',
  '.KBBBBKKBBBBMBK.', '.KMBBBBBBBBBMMK.', '..KMMMMMMMMMMK..', '...KKKKKKKKKK...'];
ROWS.blob_sq = [
  '................', '................', '................', '................', '................', '.........VV.....',
  '........VUK.....', '....KKKKKKKK....', '..KKBBBBBBBBKK..', '.KBBLLLBBBBBBBK.', 'KBBLLBBBBBBBBBBK', 'KBEWWBBBBBEWWBBK',
  'KBEWWBBBBBEWWBBK', 'KBBBBBKKBBBBBMBK', '.KMMMMMMMMMMMMK.', '..KKKKKKKKKKKK..'];
ROWS.blob_st = [
  '........VV......', '.......VUK......', '......KKKK......', '.....KBBBBK.....', '....KBLLBBBK....', '...KBLLBBBBBK...',
  '...KBLBBBBBBK...', '...KEWWBBEWWK...', '...KEWWBBEWWK...', '...KBBBBBBBBK...', '...KBBBKKBBMK...', '...KBBBBBBBMK...',
  '...KMBBBBBBMK...', '...KMMBBBBMMK...', '....KMMMMMMK....', '.....KKKKKK.....'];
ROWS.blob_flat = [
  '................', '................', '................', '................', '................', '................',
  '................', '................', '................', '................', '................', '...KKKKKKKKKK...',
  '.KKBKBKBBKBKBKK.', 'KBBBBKBBBBKBBBBK', 'KBBBKBKBBKBKBBBK', '.KKKKKKKKKKKKKK.'];
const blink = rows => { let n = 0; return rows.map(r => r.includes('E') ? r.replace(/[EW]/g, n++ ? 'K' : 'B') : r); };
for (const k of ['blob_n', 'blob_sq', 'blob_st']) ROWS[k + '_b'] = blink(ROWS[k]);
PAL.blob = { K: '#3c1458', B: '#a048d8', L: '#d8a0f8', M: '#7028a8', W: '#fcfcfc', E: '#1c1828', V: '#48c838', U: '#208018' };
function blobSprite(e, tick) {
  if (e.state === 'squish') return { id: 'blob_flat', pal: 'blob' };
  if (e.state === 'dead') return { id: 'blob_n', pal: 'blob', vflip: true };
  const k = ['blob_n', 'blob_sq', 'blob_n', 'blob_st'][Math.floor(e.anim / 8) % 4];
  return { id: (e.anim + e.seed) % 140 < 7 ? k + '_b' : k, pal: 'blob', flip: e.dir > 0 };
}
/* END:blob */

/* SEC:pango */
/* ---- Pangolim (16x24, olha para a esquerda; vira bola quando pisado): A=escamas S=pele T=pele escura E=olho W=garra ---- */
const scales = rows => rows.map((r, y) => r.replace(/A/g, (m, x) => {
  const u = (x + (Math.floor(y / 3) % 2) * 2) % 4, v = y % 3;
  return v === 0 ? (u === 3 ? 'M' : 'H') : v === 1 ? (u === 3 ? 'M' : 'A') : (u === 0 ? 'A' : 'M');
}));
const PBODY = scales([
  '................', '................', '................', '.......KKKK.....', '.....KKSSAAK....', '...KKSSESAAAK...',
  'KKKSSSSSAAAAAK..', 'KSSSSSSAAAAAAAK.', '.KKKTSSAAAAAAAK.', '....KTSAAAAAAAAK', '....KSSAAAAAAAAK', '...KSSSAAAAAAAAK',
  '...KWSSAAAAAAAAK', '....KSSAAAAAAAAK', '....KTSAAAAAAAAK', '....KTTAAAAAAAAK', '.....KTAAAAAAAAK', '.....KTAAAAAAAAK',
  '......KAAAAAAAAK', '.......KKKKKKKKK']);
const PLEGS = {
  a: ['....KSSK.KTTK...', '...KSSK...KTTK..', '..KSSSK....KTTK.', '..KWKWK....KWKWK'],
  b: ['.....KSSKTTK....', '....KSSSKTTTK...', '....KWKWKWKWK...'],
  c: ['....KTTK.KSSK...', '...KTTK...KSSK..', '..KTTTK....KSSK.', '..KWKWK....KWKWK'],
};
ROWS.pango_a = compose(16, 24, [[PBODY], [PLEGS.a, 0, 20]]);
ROWS.pango_b = compose(16, 24, [[PBODY, 0, 1], [PLEGS.b, 0, 21]]);
ROWS.pango_c = compose(16, 24, [[PBODY], [PLEGS.c, 0, 20]]);
const ballRows = (spin, peek) => {
  const rows = [];
  for (let y = 0; y < 16; y++) {
    let r = '';
    for (let x = 0; x < 16; x++) {
      const dx = x - 7.5, dy = y - 7.5, d = Math.hypot(dx, dy);
      if (d > 7.7) { r += '.'; continue; }
      if (d > 6.6) { r += 'K'; continue; }
      const a = ((Math.atan2(dy, dx) + spin) % (Math.PI / 3) + Math.PI / 3) % (Math.PI / 3);

function pixDisc(c, x, y, r) { for (let dy = -r; dy <= r; dy++) { const w = Math.round(Math.sqrt(r * r - dy * dy)); c.fillRect(x - w, y + dy, w * 2 + 1, 1); } }

const enemySprite = (e, tick, px) => e.type === 'blob' ? blobSprite(e, tick) : pangoSprite(e, tick, px);

var SPEC = {

<script>
/* viewer: monta a folha de quadros da secao em teste (usado pelo _wip/build.ps1).
   Partes (#part=): frames = quadros ampliados com grade; anim = sequencias no ritmo do jogo;
   track = trilha (uma linha por tick, posicao real no chao) para ver se o pe patina + tamanho real. */
(function () {
  const part = (location.hash.match(/part=(\w+)/) || [])[1] || 'frames';
  const W = 1360, SKY = '#5c94fc', GROUND = '#c84c0c';
  const c = document.createElement('canvas'); c.width = W; c.height = 1500;
  document.body.appendChild(c);
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.fillStyle = '#1b1d24'; x.fillRect(0, 0, W, c.height);
  let y = 8;
  const text = (t, X, Y, col = '#e8eaf0', size = 13, bold) => { x.fillStyle = col; x.font = (bold ? 'bold ' : '') + size + 'px Segoe UI, Arial, sans-serif'; x.fillText(t, X, Y); };
  const problems = (window.__errs || []).slice();
  if (typeof ROWS === 'undefined' || typeof SPEC === 'undefined') {
    problems.push('O codigo da secao nao carregou (veja o erro acima).');
  } else {
    for (const k in ROWS) { const w0 = ROWS[k][0].length; ROWS[k].forEach((r, i) => { if (r.length !== w0) problems.push(k + ': linha ' + i + ' tem ' + r.length + ' colunas (esperado ' + w0 + ')'); }); }
    for (const id of SPEC.grounded || []) if (ROWS[id] && /^\.*$/.test(ROWS[id][ROWS[id].length - 1])) problems.push(id + ': ultima linha vazia (flutua acima do chao)');
    for (const [id, w, h] of SPEC.sizes || []) if (ROWS[id] && (ROWS[id][0].length !== w || ROWS[id].length !== h)) problems.push(id + ': tamanho ' + ROWS[id][0].length + 'x' + ROWS[id].length + ', esperado ' + w + 'x' + h);
  }
  const ok = (id, pal) => {
    if (!ROWS[id]) { problems.push('quadro inexistente: ' + id); return false; }
    if (!PAL[pal]) { problems.push('paleta inexistente: ' + pal); return false; }
    return true;
  };
  text((typeof SPEC !== 'undefined' ? SPEC.title : 'secao') + '  —  parte: ' + part, 8, y + 16, '#fcc43c', 18, true); y += 30;
  const errY = y; y += 6;

  try {
    if (part === 'frames') for (const g of SPEC.groups || []) {
      text(g.title, 8, y + 14, '#9aa1b2', 13, true); y += 22;
      let X = 8, rowH = 0;
      for (const f of g.items) {
        if (!ok(f[0], f[1])) continue;
        const im = spr(f[0], f[1], f[2], f[3]), w = im.width * g.scale, h = im.height * g.scale;
        if (X + w > W - 8) { X = 8; y += rowH + 20; rowH = 0; }
        x.fillStyle = SKY; x.fillRect(X, y, w, h);
        x.drawImage(im, X, y, w, h);
        if (g.grid !== false && g.scale >= 6) {
          x.fillStyle = 'rgba(0,0,0,0.10)';
          for (let i = 1; i < im.width; i++) x.fillRect(X + i * g.scale, y, 1, h);
          for (let j = 1; j < im.height; j++) x.fillRect(X, y + j * g.scale, w, 1);
        }
        text(f[0] + (f[1] !== g.items[0][1] ? ' · ' + f[1] : ''), X, y + h + 14, '#c8ccd8', 11);
        X += w + 12; rowH = Math.max(rowH, h);
      }
      y += rowH + 30;
    }

    if (part === 'anim') for (const s of SPEC.strips || []) {
      text(s.title, 8, y + 14, '#9aa1b2', 13, true); y += 22;
      const cw = s.cw * s.scale, ch = s.ch * s.scale; let X = 8;
      if (s.reset) s.reset();
      for (let i = 0; i < s.n; i++) {
        const f = s.frame(i);
        if (X + cw > W - 8) { X = 8; y += ch + 20; }
        x.fillStyle = SKY; x.fillRect(X, y, cw, ch);
        x.fillStyle = GROUND; x.fillRect(X, y + ch - 3 * s.scale, cw, 3 * s.scale);
        x.fillStyle = '#000'; x.fillRect(X, y + ch - 3 * s.scale, cw, Math.max(1, s.scale >> 1));
        if (f && f.under) f.under(x, X, y, s.scale);
        if (f && f.id && ok(f.id, f.pal)) {
          const im = spr(f.id, f.pal, f.flip, f.vflip), h = f.h || im.height;
          const dx = Math.round((s.cw - im.width) / 2 + (f.dx || 0)), dy = s.ch - 3 - h + (f.dy || 0);

        X += cw + 8;

    if (part === 'track') {

        let X = 8;
        for (const s of [1, 2, 3]) {
          const list = SPEC.context.filter(f => ok(f[0], f[1]));
          const w = list.reduce((a, f) => a + (spr(f[0], f[1]).width + 6) * s, 6 * s), h = 40 * s;
          x.fillStyle = SKY; x.fillRect(X, y, w, h); x.fillStyle = GROUND; x.fillRect(X, y + h - 6 * s, w, 6 * s);
          let cx = X + 4 * s;
          for (const f of list) { const im = spr(f[0], f[1], f[2], f[3]); x.drawImage(im, cx, y + h - 6 * s - im.height * s, im.width * s, im.height * s); cx += (im.width + 6) * s; }
          X += w + 16;
        }
        y += 40 * 3 + 20;
      }
    }
  } catch (e) { problems.push('erro no viewer/spec: ' + e.message); }

  if (problems.length) {
    x.fillStyle = '#5a1010'; x.fillRect(8, errY - 4, W - 16, 18 * Math.min(problems.length, 12) + 10);
    problems.slice(0, 12).forEach((p, i) => text('PROBLEMA: ' + p, 16, errY + 12 + i * 18, '#ffb0b0', 13, true));
  }
})();

</script>
