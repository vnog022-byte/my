<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de animações</title>
<style>
  :root{--bg:#14161c;--card:#1d2029;--line:#2e3340;--fg:#e8eaf0;--mute:#9aa1b2}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif}
  header{padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
  h1{font-size:18px;margin:0 8px 0 0}
  label{display:flex;align-items:center;gap:8px;color:var(--mute)}
  input[type=range]{width:130px}
  select,button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:inherit;cursor:pointer}
  main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .card h2{font-size:14px;margin:0}
  .card p{margin:0;color:var(--mute);font-size:12px}
  .stage{display:flex;justify-content:center;overflow:hidden;border-radius:6px}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;max-width:100%}
  .tag{font-size:11px;color:var(--mute);font-family:ui-monospace,monospace}
  .strip{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end}
  .strip canvas{background:#5c94fc;border-radius:3px}
  @media (max-width:520px){main{grid-template-columns:1fr;padding:12px}}
</style>
</head>
<body>
<header>
  <h1>Painel de animações</h1>
  <label>Velocidade do herói <input id="vx" type="range" min="0" max="2.5" step="0.1" value="1.5"><span id="vxv">1.5</span></label>
  <label>Zoom <select id="zoom"><option value="3">3x</option><option value="4" selected>4x</option><option value="5">5x</option></select></label>
  <label><input id="flip" type="checkbox"> Espelhar herói</label>
  <button id="pause">Pausar</button>
</header>
<main id="grid"></main>
<script>
'use strict';
/* copia do bloco ART do index.html (personagens, quadros e particulas) */
/* ART-BEGIN */
/* ----------------------------- ARTE -----------------------------
   Personagens originais desenhados em texto: cada letra e uma cor da paleta.
   compose() monta um quadro a partir de pedacos (cabeca, tronco, pernas, bracos).
   Cada secao (SEC:nome ... END:nome) guarda os desenhos e a escolha de quadro de um elemento. */
const compose = (w, h, parts) => {
  const g = Array.from({ length: h }, () => new Array(w).fill('.'));
  for (const [rows, dx = 0, dy = 0] of parts) rows.forEach((r, y) => {
    for (let x = 0; x < r.length; x++) { const ch = r[x], X = x + dx, Y = y + dy; if (ch !== '.' && Y >= 0 && Y < h && X >= 0 && X < w) g[Y][X] = ch; }
  });
  return g.map(r => r.join(''));
};
const mirror = rows => rows.map(r => [...r].reverse().join(''));
const rot90 = rows => [...rows[0]].map((_, x) => rows.map(r => r[x]).reverse().join(''));
const recolor = (rows, m) => rows.map(r => r.replace(/./g, ch => m[ch] || ch));
const shade = rows => recolor(rows, { C: 'M', S: 'T' });
const swapLegs = rows => recolor(rows, { P: 'Q', Q: 'P', O: 'N', N: 'O' });
const ROWS = {}, PAL = {};
const sprCache = new Map();
function spr(id, pal, flip, vflip) {
  const key = id + '|' + pal + '|' + (flip ? 1 : 0) + (vflip ? 1 : 0);
  let c = sprCache.get(key); if (c) return c;
  const rows = ROWS[id], P = PAL[pal], w = rows[0].length, h = rows.length;
  c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let r = 0; r < h; r++) for (let q = 0; q < w; q++) {
    const ch = rows[r][q]; if (ch === '.' || !P[ch]) continue;
    x.fillStyle = P[ch]; x.fillRect(flip ? w - 1 - q : q, vflip ? h - 1 - r : r, 1, 1);
  }
  sprCache.set(key, c); return c;
}

/* SEC:hero */
/* ---- Heroi pequeno (16x16), cabeca e paletas compartilhadas, e escolha de quadro do heroi.
   Sub-paletas: corpo K/C/L (contorno, moletom, claro), pele S + olho E(=K), pernas P/Q (calca vinho perto/longe).
   Tenis creme O = N (contrastam com moletom, ceu e tijolo); T, B fundidos em S (as letras continuam definidas para o heroi grande).
   Cada quadro e pintado em camadas por HS_paint: perna de longe, perna de perto e bracos (manga C + mao S)
   ganham contorno K automatico (sola K = contato com o chao); tronco e cabeca HH (12x7 em x=2).
   Caminhada em 4 quadros: contato (perna da frente quase vertical, pe de tras na ponta com o calcanhar
   erguido), passagem (perna de apoio reta, a livre dobrada com o pe erguido atras, canela inclinada), e os mesmos com as
   pernas trocadas. A ponta do pe de apoio vai 14 -> 9 -> 4: 5 px por quadro = HERO_STEP_S. ---- */
const HH = [
  '.K.....K....',
  'KLK...KLK...',
  'KLCK..KLCK..',
  'KCCCKKCCCCK.',
  'KCCLSSSSESSK',
  'KCCLSSSSEESK',
  '.KCLSSSSSSK.'];
const HH2 = ['............', 'KK.....KKK..', 'KLK...KLLCK.'].concat(HH.slice(3));
/* rosto de frente (susto), 10 de largura em x=3: 1 linha de pele na testa, olhos 2x2 arregalados, boca aberta */
const HF = [
  '.K......K.',
  'KLK....KLK',
  'KLCKKKKCLK',
  'KSSSSSSSSK',
  'KSEESSEESK',
  'KSEESSEESK',
  '.KSSKKSSK.'];
const HS_paint = parts => {
  const g = Array.from({ length: 16 }, () => new Array(16).fill('.'));
  for (const [rows, dx = 0, dy = 0, ol = false] of parts) {
    const h = rows.length, w = rows[0].length;
    const on = (x, y) => y >= 0 && y < h && x >= 0 && x < w && rows[y][x] !== '.';
    if (ol) for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
      if (on(x, y) || !(on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1))) continue;
      const X = x + dx, Y = y + dy; if (X >= 0 && X < 16 && Y >= 0 && Y < 16 && (ol !== 's' || g[Y][X] === '.')) g[Y][X] = 'K';
    }
    rows.forEach((r, y) => { for (let x = 0; x < w; x++) { const X = x + dx, Y = y + dy; if (r[x] !== '.' && X >= 0 && X < 16 && Y >= 0 && Y < 16) g[Y][X] = r[x]; } });
  }
  return g.map(r => r.join(''));
};
const HS_TORSO = ['...KCCCCCCCCK...', '...KCCCCCCCCK...', '....KLLLLLLK....'];
const hsKeep = (rows, set) => rows.map(r => r.replace(/./g, ch => set.includes(ch) ? ch : '.'));
/* pernas (preenchimento, 16 de largura), comecam na linha y0: Q/N = perna de longe, P/O = de perto */
const HS_LEG = {
  stand: [10,
    '.....QQQPPP.....',
    '.....QQ.PP......',
    '.....QQ.PP......',
    '....NNN.OOO.....',
    '....NNNNOOOO....'],
  cA: [11, // contato: perto na frente (quase vertical, degrau no joelho), longe atras na ponta do pe
    '......QQQPPP....',
    '....QQ.....PP...',
    '..NNN......OOO..',
    '...NN......OOOO.'],
  pA: [10, // passagem: perto reta embaixo do corpo, longe dobrada com o pe erguido atras, canela inclinada
    '.....QQPPP......',
    '.....QQPP.......',
    '...NQQ.PP.......',
    '...NN.OOO.......',
    '......OOOO......'],
  jump: [10, // perto encolhida (coxa horizontal), longe esticada para baixo
    '.....QQ.PPPP....',
    '....QQ.....PP...',
    '....QQ.....OOO..',
    '...QQ...........',
    '..NNN...........'],
  fall: [10,
    '.....QQQPPP.....',
    '....QQ...PP.....',
    '....QQ....PP....',
    '...NNN....OOO...',
    '...NNNN...OOOO..'],
  skid: [10, // pes plantados para o lado do movimento: longe esticada, perto dobrada
    '.......QQPPPP...',
    '.....QQ..PP.....',
    '...QQ...PP......',
    '..NNN...OOO.....',
    '.NNNN...OOOO....'],
  land: [12,
    '....QQQ..PPP....',
    '...NNN....OOO...',
    '...NNNN...OOOO..'],
  climb1: [10, // joelho de perto alto com o pe no mastro, perna de longe enganchada embaixo
    '....QQPPPPP.....',
    '....QQ....PP....',
    '....QQ....OOO...',
    '.....QQ.........',
    '.....NNNN.......'],
  die: [10,
    '.....QQQPPP.....',
    '.....QQ..PP.....',
    '.....QQ..PP.....',
    '.....NN..OO.....',
    '....NNN..OOO....'],
};
HS_LEG.cB = [HS_LEG.cA[0], ...swapLegs(HS_LEG.cA.slice(1))]; HS_LEG.pB = [HS_LEG.pA[0], ...swapLegs(HS_LEG.pA.slice(1))];
HS_LEG.climb2 = [HS_LEG.climb1[0], ...swapLegs(HS_LEG.climb1.slice(1))];
/* bracos de 2 px (manga C + mao S), com contorno: [desenho, x, y] */
const HS_ARM = {
  dn: ['C', 'S'], bk: ['.C', 'S.'], fw: ['C.', '.S'],
  upR: ['..S', '.C.', 'C..'], upL: ['S..', '.C.', '..C'],
  side: ['SC', 'SC'], sideR: ['CS', 'CS'], grab: ['CS'], reach: ['.S', 'C.'], hi: ['S.', 'S.', 'C.', '.C'],
  /* desenhos prontos (ja com contorno), sem contorno automatico */
  jumpR: ['..............KK', '.............KSS', '.............KSS', '.............KCC', '.............KCC',
    '.............KCC', '.............KCC', '.............CCC', '.............KKK'],
  skidL: ['.KK..', 'KSS..', 'KSS..', '.KKCK', '..KKC', '...KK'],
  dieV: ['K..............K', 'SK............KS', 'SK............KS', 'KC............CK', 'KC............CK',
    '.KCK........KCK.', '.KC..........CK.', '..K..........K..'],
};
const HS_RAW = ['jumpR', 'dieV', 'skidL'];
const hsFrame = ({ head = HH, hx = 2, hy = 0, tx = 0, leg, arms = [], torso = HS_TORSO, patch = {} }) => {
  const [y0, ...rows] = leg;
  const g = HS_paint([
    [hsKeep(rows, 'QN'), 0, y0, true],
    [hsKeep(rows, 'PO'), 0, y0, 's'],
    [torso, tx, 7 + hy],
    [head, hx, hy],
    ...arms.map(([a, x, y]) => [HS_ARM[a], x, y, !HS_RAW.includes(a)]),
    ...arms.map(([a, x, y]) => [HS_ARM[a], x, y]), // repinta as mangas por cima do contorno do outro braco
  ]);
  for (const y in patch) g[y] = patch[y]; // linhas pintadas a mao
  return g;
};
const ARMS_DN = [['dn', 3, 8], ['dn', 12, 8]];
const HS_SPATCH = { 14: '...KNNNNKOOOK...' }; // K separa os dois tenis
ROWS.h_stand = hsFrame({ leg: HS_LEG.stand, arms: ARMS_DN, patch: HS_SPATCH });
ROWS.h_stand2 = hsFrame({ head: HH2, leg: HS_LEG.stand, arms: ARMS_DN, patch: HS_SPATCH });
/* caminhada: no contato so a mao da frente aparece (a de tras fica atras do tronco); na passagem, uma mao */
/* contato: entre as pernas fica um triangulo de ceu (linhas 11-12 pintadas a mao) */
const HS_CPATCH = { 11: '....KQQQKPPPKK..', 12: '...KQQK..KPPK...' };
const HS_CPATCH_B = { 11: swapLegs([HS_CPATCH[11]])[0], 12: swapLegs([HS_CPATCH[12]])[0] };
ROWS.h_w1 = hsFrame({ hy: 1, leg: HS_LEG.cA, arms: [['fw', 12, 9]], patch: HS_CPATCH });
/* passagem: pe livre 2 px acima do chao, separado do pe de apoio (linhas 10-14 pintadas a mao) */
const HS_PPATCH = { 10: '....KQQPPPK.....', 11: '...KQQKPPK......', 12: '..KNNKKPPK......', 13: '...KKKOOOK......', 14: '.....KOOOOK.....' };
const HS_PPATCH_B = Object.fromEntries(Object.entries(HS_PPATCH).map(([y, r]) => [y, swapLegs([r])[0]]));
ROWS.h_w2 = hsFrame({ leg: HS_LEG.pA, arms: [['dn', 12, 7]], patch: HS_PPATCH });
ROWS.h_w3 = hsFrame({ hy: 1, leg: HS_LEG.cB, arms: [['fw', 12, 9]], patch: HS_CPATCH_B });
ROWS.h_w4 = hsFrame({ leg: HS_LEG.pB, arms: [['dn', 12, 7]], patch: HS_PPATCH_B });
ROWS.h_jump = hsFrame({ leg: HS_LEG.jump, arms: [['bk', 2, 8], ['jumpR', 0, 0]] });
ROWS.h_fall = hsFrame({ leg: HS_LEG.fall, arms: [['upL', 0, 5], ['upR', 13, 5]] });
ROWS.h_skid = hsFrame({ hx: 4, tx: 2, leg: HS_LEG.skid, arms: [['skidL', 0, 4], ['dn', 14, 8]] });
ROWS.h_land = hsFrame({ hy: 2, leg: HS_LEG.land, arms: [['bk', 2, 10], ['fw', 12, 10]] });
ROWS.h_climb1 = hsFrame({ hx: 1, tx: -1, leg: HS_LEG.climb1, arms: [['reach', 12, 6], ['grab', 12, 8]] });
ROWS.h_climb2 = hsFrame({ hx: 1, tx: -1, leg: HS_LEG.climb2, arms: [['grab', 12, 7], ['fw', 12, 8]] });
ROWS.h_die1 = hsFrame({ head: HF, hx: 3, leg: HS_LEG.die, arms: [['side', 1, 8], ['sideR', 13, 8]] });
ROWS.h_die2 = hsFrame({ head: HF, hx: 3, leg: HS_LEG.die, arms: [['dieV', 0, 1]] });
for (const k in ROWS) if (k.startsWith('h_') && (ROWS[k].length !== 16 || ROWS[k].some(r => r.length !== 16))) throw new Error('tamanho errado ' + k);

const HERO = { K: '#1c1828', C: '#20a08c', L: '#9cf0d8', M: '#127060', S: '#fcc8a0', T: '#e09870', B: '#fcc8a0', E: '#1c1828',
  P: '#c0385c', Q: '#8c2450', O: '#f8f0e0', N: '#f8f0e0' };
PAL.hero = HERO;
PAL.heroF = { ...HERO, C: '#e8401c', L: '#fcd860', M: '#981c10', P: '#fcf4e0', Q: '#c8b48c', O: '#fcd860', N: '#e8401c' };
PAL.heroS1 = { ...HERO, C: '#f8b800', L: '#fcf0a0', M: '#b07000', P: '#e84010', Q: '#a02008', O: '#fcf0a0', N: '#f8b800' };
PAL.heroS2 = { ...HERO, C: '#f83890', L: '#fcc0e0', M: '#a01858', P: '#6c2c9c', Q: '#401868', O: '#fcc0e0', N: '#f83890' };
PAL.heroS3 = { ...HERO, C: '#38c8f8', L: '#d0f8fc', M: '#1870b0', P: '#d86818', Q: '#904008', O: '#d0f8fc', N: '#38c8f8' };

/* escolha do quadro: a caminhada avanca pela distancia percorrida (um quadro a cada HERO_STEP px),
   assim o pe de apoio nao patina. HERO_WALK_B e HERO_STEP_B ficam na secao herobig. */
const HERO_WALK_S = ['w1', 'w2', 'w3', 'w4'], HERO_STEP_S = 5, STAR_PALS = ['heroS1', 'heroS2', 'heroS3', 'hero'];
function stepWalk(p, big) {
  const s = Math.abs(p.vx), d = big ? HERO_STEP_B : HERO_STEP_S;
  if (p.ground && s > 0.15) { p.walkD += s; if (p.walkD >= d) { p.walkD -= d; p.walkF = (p.walkF + 1) % 840; } }
  else p.walkD = d;
}
function heroPose(p, big) {
  if (p.state === 'die') return (p.t >> 3) & 1 ? 'die2' : 'die1';
  if (p.state === 'flag') return Math.floor(p.anim) % 2 ? 'climb2' : 'climb1';
  if (!p.ground) return p.vy < 0 ? 'jump' : 'fall';
  if (p.landT > 0) return 'land';
  if (p.skid) return 'skid';
  if (Math.abs(p.vx) > 0.15) { const w = big ? HERO_WALK_B : HERO_WALK_S; return w[p.walkF % w.length]; }
  return p.idle % 160 > 148 ? 'stand2' : 'stand';
}
function heroSprite(p, big) {
  const pose = heroPose(p, big);
  if (!big || pose.startsWith('die')) return 'h_' + pose;
  return p.throwT > 0 && ROWS['H_' + pose + '_t'] ? 'H_' + pose + '_t' : 'H_' + pose;
}
const heroPal = (p, tick) => p.star > 0 ? STAR_PALS[Math.floor(tick / (p.star < 120 ? 6 : 3)) % 4] : p.power === 2 ? 'heroF' : 'hero';
const GROW_SEQ = [16, 24, 16, 24, 32, 24, 32, 24, 32];
/* END:hero */

/* SEC:herobig */
/* ---- Heroi grande TICO (16x32): cabeca propria HB_HEAD/HB_HEAD2 (16x14, em x=0, proporcao chibi como a do pequeno); paletas da secao hero.
   Corpo em 3/4 de perfil, virado para a direita: braco de perto na frente do tronco, o de longe atras.
   Mesmas cores do heroi pequeno: K contorno, C/L moletom, S pele, P/Q calca (perto/longe), O/N tenis.
   Tudo e pintado em camadas por HB_paint; pernas, tenis, bracos e tronco ganham contorno K automatico
   (a sola K e o contato com o chao), entao as pernas se separam pela forma, pelo ceu e pelo contorno.
   O braco de perto, sobre o moletom, ganha so uma linha M na borda de tras (a da frente fica sem contorno).
   Tronco longo com giro e pernas curtas e retas (sem joelho). Caminhada de 6 fases (uma perna desenhada; a outra
   e a mesma 3 fases depois): o calcanhar de apoio recua 11 > 7 > 3, 4 px por quadro = HERO_STEP_B, entao o pe
   de apoio nao patina. ---- */
const HB_paint = parts => {
  const g = Array.from({ length: 32 }, () => new Array(16).fill('.'));
  for (const { rows, x = 0, y = 0, ol = false, y1 = -99, y2 = 99 } of parts) {
    const h = rows.length, w = rows[0].length;
    const on = (i, j) => j >= 0 && j < h && i >= 0 && i < w && rows[j][i] !== '.';
    const put = (X, Y, ch) => { if (X >= 0 && X < 16 && Y >= 0 && Y < 32 && Y >= y1 && Y <= y2) g[Y][X] = ch; };
    if (ol) for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
      if (on(i, j) || !(on(i - 1, j) || on(i + 1, j) || on(i, j - 1) || on(i, j + 1))) continue;
      const X = i + x, Y = j + y, under = X >= 0 && X < 16 && Y >= 0 && Y < 32 ? g[Y][X] : '.';
      // contorno suave: sobre o moletom, so a borda de tras do braco (pixel a esquerda dele) vira M
      if (ol === 's' && 'CLM'.includes(under)) { if (on(i + 1, j)) put(X, Y, 'M'); continue; }
      if (ol === 's' && 'PQ'.includes(under)) continue; // nao morde a calca
      put(X, Y, 'K');
    }
    rows.forEach((r, j) => { for (let i = 0; i < w; i++) if (r[i] !== '.') put(i + x, j + y, r[i]); });
  }
  return g.map(r => r.join(''));
};
/* cabeca propria do heroi grande (16x14, em x=0, ~44% da altura como no heroi pequeno): mesmo personagem da HH
   (capuz com orelhas, borda clara, olho com brilho L), redesenhada grande. Cantos de cima arredondados e a aba do
   capuz cobrindo a testa (linha 6); testa recuada (x=13) para o focinho (linha 10) se destacar; borda clara L
   acompanhando o rosto e curvando no queixo; domo do capuz iluminado em C/L e volume M so atras, embaixo.
   Olho 2x4 no terco de cima do rosto com brilho L. T = sombra da aba (coluna ao lado da borda) e bochecha; boca K.
   (Na paleta final T e igual a S; as letras T ficam prontas caso o tom de sombra da pele seja ligado.) */
const HB_HEAD = [
  '..K......K......',
  '.KLK....KLK.....',
  '.KLCK...KLCK....',
  '.KLCCK..KLCCK...',
  '.KCLCCKKCCCCCK..',
  'KCLLCCCCCCCCCCK.',
  'KCCCCLLLLLLLLK..',
  'KCCCCLTSSSSSSK..',
  'KCCCCLTSSSELSK..',
  'KMCCCLTSSSEESSK.',
  'KMCCCLTSSSEESSSK',
  'KMCCCCLTSSEESSK.',
  '.KMCCCCLSSTTKSK.',
  '..KMMCCLSSSSSK..'];
/* orelha mexendo (equivale a HH2): a orelha da frente dobra para a frente */
const HB_HEAD2 = ['..K.............', '.KLK.....KKK....', '.KLCK...KLLCK...', '.KLCCK..KLCCCK..'].concat(HB_HEAD.slice(4));
/* ---- corpo: tronco longo (linhas 14-22) com giro, quadril (23-24) e pernas curtas e retas, sem joelho (25-30).
   O giro (tw = -1/0/+1) desloca ombros, peito e cordoes do capuz 1 px em relacao ao bolso e ao quadril, sempre
   oposto a perna da frente: com a perna de perto a frente, o ombro de perto vai para tras (tw -1), e vice-versa.
   Como as pernas nao tem joelho, e esse giro (com o balanco dos bracos) que da a naturalidade da caminhada. ---- */
const HB_TY = 14, HB_HY = 23, HB_LY = 25;
const HB_TORSO_BASE = [
  '....CCCCCCCC....', // 14 gola
  '...CCCCCCCCCC...', // 15 ombros
  '...CCCCCCCCCC...',
  '...CCCCCCCCCC...',
  '....CCCCCCCCC...',
  '....CCCCCCCC....', // 19
  '....CMMMMMMC....', // 20 boca do bolso canguru
  '....CCCCCCCC....',
  '....LLLLLLLL....']; // 22 barra clara
const HB_shift = (r, d) => d > 0 ? '.'.repeat(d) + r.slice(0, 16 - d) : d < 0 ? r.slice(-d) + '.'.repeat(-d) : r;
/* tronco com giro: ombros e peito (linhas 14-18) deslocam tw; cordoes L sob a gola acompanham o peito */
const HB_torso = tw => HB_TORSO_BASE.map((r, i) => {
  if (i > 4) return r;
  let row = HB_shift(r, tw);
  if (i >= 1 && i <= 3) { const a = 8 + tw, b = 10 + tw; row = row.slice(0, a) + 'L' + row.slice(a + 1, b) + (i < 3 ? 'L' : 'C') + row.slice(b + 1); }
  return row;
});
const HB_HIP = ['.....PPPPPP.....', '.....PPPPPP.....'];

  if (e.state === 'walk') return { id: PG_WALK[Math.floor(e.anim / 7) % 4], pal: 'pango', flip: e.dir > 0 };
  if (e.state === 'shellmove') return { id: 'ball' + (((Math.floor(e.roll / 6) % 4) + 4) % 4), pal: 'pango' };

  const T0 = e.shellT, flip = px > e.x, warn = T0 >= PANGO_UNROLL - 90;

const fireH = heroMock({ power: 2 }); let shots = [];
card('Herói de fogo arremessando', 'O braço estica por 10 ticks; a bola de fogo gira, quica e estoura numa nuvem.', 96, 48, (c, s) => {
  if (tick % 60 === 0) { fireH.throwT = 10; shots.push({ x: 26, y: 24, vx: 1.6, vy: 0, t: 0 }); }
  if (fireH.throwT > 0) fireH.throwT--;
  for (const f of shots) {
    f.t++; f.x += f.vx; f.vy += 0.3; f.y += f.vy; if (f.y > 34) { f.y = 34; f.vy = -2.6; }
    if (f.x > 84) { f.dead = true; s.parts.push({ k: 'ring', x: f.x + 4, y: f.y + 4, vx: 0, vy: 0, t: 0, life: 12, col: '#f88818' }); }
  }
  shots = shots.filter(f => !f.dead);
  put(c, heroSprite(fireH, true), 'heroF', 8, 10);
  for (const f of shots) put(c, fireSprite(f), 'fire', f.x, f.y);
  return fireH.throwT > 0 ? 'arremesso' : 'parado';
}, [['H_stand_t', 'heroF'], ['H_w1_t', 'heroF'], ['H_jump_t', 'heroF'], ['fire0', 'fire'], ['fire1', 'fire'], ['fire2', 'fire'], ['fire3', 'fire']]);

/* estrela */
const starH = heroMock({ power: 1, star: 600 });
card('Invencível (estrela)', 'A paleta troca a cada 3 ticks (a cada 6 quando está acabando) e solta brilhos.', 48, 48, (c, s) => {
  starH.star = 600 - (tick % 600); walkTick(starH, true);
  if (tick % 4 === 0) twinkle(s.parts, 12 + Math.random() * 24, 10 + Math.random() * 32, ['#fcfcfc', '#fcd848', '#f8a0e0'][(tick >> 2) % 3]);
  const pal = heroPal(starH, tick); put(c, heroSprite(starH, true), pal, 16, 10, opts.flip);
  return pal + (starH.star < 120 ? ' (acabando)' : '');
}, ['heroS1', 'heroS2', 'heroS3', 'hero'].map(p => ['H_stand', p]));

/* crescer e encolher */
const still = heroMock();
card('Crescer e encolher', 'Alterna pequeno, meio-termo esticado e grande (ao contrário quando leva dano).', 48, 48, c => {
  const t = tick % 120;
  let hh = 16, label = 'pequeno';
  if (t < 45) { hh = GROW_SEQ[Math.floor(t / 5)]; label = 'crescendo'; }
  else if (t < 60) { hh = 32; label = 'grande'; }
  else if (t < 105) { hh = 48 - GROW_SEQ[Math.floor((t - 60) / 5)]; label = 'encolhendo'; }
  c.drawImage(spr(heroSprite(still, hh > 16), 'hero', opts.flip), 16, 42 - hh, 16, hh);
  return label + ' (' + hh + ' px)';
}, [['h_stand', 'hero'], ['H_stand', 'hero']]);

/* morte e mastro */
const dieH = heroMock({ state: 'die' }), poleH = heroMock({ state: 'flag' });
card('Susto e escalada no mastro', 'Ao morrer ele vira de frente agitando os braços; no mastro as mãos se alternam.', 80, 48, c => {
  dieH.t = tick; poleH.anim = tick * 0.15;
  put(c, heroSprite(dieH, false), 'hero', 8, 26 - Math.sin((tick % 60) / 60 * Math.PI) * 8);
  c.fillStyle = '#80d010'; c.fillRect(65, 0, 2, 42);
  put(c, heroSprite(poleH, false), 'hero', 53, 4 + (tick % 60) / 3);
  return heroPose(dieH) + ' / ' + heroPose(poleH);
}, frames('h_', ['die1', 'die2', 'climb1', 'climb2'], 'hero').concat(frames('H_', ['climb1', 'climb2'], 'hero')));

/* gosma */
const blob = { type: 'blob', state: 'walk', anim: 0, seed: 0, dir: -1, x: 60, t: 0 };
card('Gosma andando e pisada', 'Estica e achata a cada passo e pisca. Pisada, vira uma poça e espirra gotas.', 96, 40, (c, s) => {
  if (blob.state === 'walk') {
    blob.anim++; blob.x += blob.dir * 0.5; if (blob.x < 6 || blob.x > 74) blob.dir *= -1;
    if (tick % 200 === 199) {
      blob.state = 'squish'; blob.t = 40; s.parts.push({ k: 'burst', x: blob.x + 8, y: 18, vx: 0, vy: 0, t: 0, life: 10 });
      for (let i = 0; i < 8; i++) { const a = Math.PI + Math.random() * Math.PI; s.parts.push({ k: 'goo', x: blob.x + 8, y: 30, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 2, g: 0.2, t: 0, life: 26, col: i % 2 ? '#a048d8' : '#d8a0f8' }); }
    }
  } else if (--blob.t <= 0) blob.state = 'walk';
  const f = enemySprite(blob, tick, 0); put(c, f.id, f.pal, blob.x, 18, f.flip, f.vflip); return f.id;
}, [['blob_n', 'blob'], ['blob_sq', 'blob'], ['blob_st', 'blob'], ['blob_n_b', 'blob'], ['blob_flat', 'blob']]);

/* pangolim */
const pw = { type: 'pango', state: 'walk', anim: 0, dir: -1, h: 24, x: 4 }, pb = { type: 'pango', state: 'shell', shellT: 0, x: 40 }, pr = { type: 'pango', state: 'shellmove', roll: 0, x: 72 };
card('Pangolim: anda, vira bola, espia e rola', 'Pisado, ele se enrola numa bola que espia o herói; chutado, as escamas giram.', 96, 48, c => {
  pw.anim++; pb.shellT++; pr.roll += 2.1;
  const a = enemySprite(pw, tick, 0), b = enemySprite(pb, tick, 0), r = enemySprite(pr, tick, 0);
  put(c, a.id, a.pal, pw.x, 18, a.flip); put(c, b.id, b.pal, pb.x, 26, b.flip); put(c, r.id, r.pal, pr.x, 26);
  return a.id + ' / ' + b.id + ' / ' + r.id;
}, [['pango_a', 'pango'], ['pango_b', 'pango'], ['pango_c', 'pango'], ['ball0', 'pango'], ['ball1', 'pango'], ['ball2', 'pango'], ['ball3', 'pango'], ['ball_peek', 'pango']]);

/* itens */
const ITEMS = [{ type: 'grow' }, { type: 'fire' }, { type: 'life' }, { type: 'star' }];
card('Itens', 'Maçã (cresce) brilha, pimenta (fogo) tremula, coração (vida) pulsa e estrela troca de cor.', 96, 32, (c, s) => {
  ITEMS.forEach((it, i) => { const f = itemSprite(it, tick); put(c, f.id, f.pal, 4 + i * 23, 10); });
  if (tick % 50 === 0) twinkle(s.parts, 9, 16);
  if (tick % 6 === 0) twinkle(s.parts, 73 + Math.random() * 16, 10 + Math.random() * 14, '#fcd848');
  return 'maçã · pimenta · coração · estrela';
}, [['apple', 'apple'], ['chili', 'chili0'], ['chili', 'chili2'], ['heart', 'heart'], ['heart2', 'heart'], ['star', 'star0'], ['star', 'star2']]);

/* efeitos */
const debr = { t: 0 };
card('Efeitos', 'Moeda girando, pedaço de tijolo, bola de fogo, poeira, brilho, impacto e estouro.', 96, 32, (c, s) => {
  put(c, coinSprite(tick), 'coin', 4, 8); debr.t = tick; put(c, debSprite(debr), 'deb', 20, 12); put(c, fireSprite({ t: tick, vx: 1 }), 'fire', 34, 12);
  if (tick % 20 === 0) puff(s.parts, 52, 22);
  if (tick % 12 === 0) twinkle(s.parts, 64, 16);
  if (tick % 30 === 0) s.parts.push({ k: 'burst', x: 76, y: 16, vx: 0, vy: 0, t: 0, life: 10 });
  if (tick % 30 === 15) s.parts.push({ k: 'ring', x: 88, y: 16, vx: 0, vy: 0, t: 0, life: 12, col: '#f88818' });
  return coinSprite(tick);
}, [['coin0', 'coin'], ['coin1', 'coin'], ['coin2', 'coin'], ['coin3', 'coin'], ['deb0', 'deb'], ['deb1', 'deb'], ['fire0', 'fire']]);

/* ------------------------- montagem e loop ------------------------- */
const grid = document.getElementById('grid');
for (const s of cards) {
  const el = document.createElement('section'); el.className = 'card';
  el.innerHTML = '<h2></h2><p></p><div class="stage"><canvas></canvas></div><div class="tag"></div><div class="strip"></div>';
  el.querySelector('h2').textContent = s.title; el.querySelector('p').textContent = s.note;
  s.cv = el.querySelector('.stage canvas'); s.cv.width = s.w; s.cv.height = s.h; s.ctx = s.cv.getContext('2d'); s.tag = el.querySelector('.tag');
  for (const [id, pal] of s.strip) {
    const im = spr(id, pal), cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
    cv.getContext('2d').drawImage(im, 0, 0); cv.style.width = im.width * 2 + 'px'; cv.title = id; el.querySelector('.strip').appendChild(cv);
  }
  grid.appendChild(el);
}
const resize = () => { for (const s of cards) s.cv.style.width = s.w * opts.zoom + 'px'; };
function step() {
  tick++;
  for (const s of cards) {
    s.parts = tickParts(s.parts); sky(s.ctx, s.w, s.h);
    s.tag.textContent = s.draw(s.ctx, s);
    for (const q of s.parts) drawPart(s.ctx, q, 0);
  }
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { acc -= 1000 / 60; if (!opts.paused) step(); }
  requestAnimationFrame(loop);
}
document.getElementById('vx').oninput = e => { opts.vx = +e.target.value; document.getElementById('vxv').textContent = e.target.value; };
document.getElementById('zoom').onchange = e => { opts.zoom = +e.target.value; resize(); };
document.getElementById('flip').onchange = e => { opts.flip = e.target.checked; };
document.getElementById('pause').onclick = e => { opts.paused = !opts.paused; e.target.textContent = opts.paused ? 'Continuar' : 'Pausar'; };
resize(); step(); requestAnimationFrame(loop);
</script>
</body>
</html>
